<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paltalk Advanced Profile Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .profile-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 15px;
        }
        .banner {
            height: 120px;
            background-size: cover;
            background-position: center;
            background-color: #ccc;
        }
        .avatar-container {
            text-align: center;
            margin-top: -50px;
            position: relative;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #fff;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            bottom: 5px;
            left: calc(50% + 30px);
        }
        .online { background-color: #28a745; }
        .offline { background-color: #6c757d; }
        
        .profile-details {
            padding: 20px;
        }
        .profile-details h3 {
            text-align: center;
            margin: 0 0 5px 0;
            color: #333;
            font-size: 20px;
        }
        .badge {
            display: block;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            padding: 3px 8px;
            border-radius: 10px;
            width: max-content;
            margin: 0 auto 20px auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        table td {
            padding: 10px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }
        table td:first-child {
            color: #718096;
            font-weight: 500;
            width: 40%;
        }
        table td:last-child {
            color: #2d3748;
            font-weight: 600;
            text-align: right;
        }
        .action-btn {
            display: block;
            text-align: center;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background-color: #218838;
        }
        .status-msg {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Paltalk Member Realtime Finder</h2>
    
    <div class="search-box">
        <input type="text" id="usernameInput" placeholder="Nhập tên tài khoản (Vd: Carol Nguyen)..." onkeydown="checkEnterKey(event)">
        <button onclick="startPaltalkRequest()">Tìm Kiếm</button>
    </div>

    <!-- Nơi hiển thị kết quả hoặc thông báo đang đợi tải -->
    <div id="resultZone">
        <div class="status-msg">Nhập từ khóa và bấm Enter để hệ thống tự động quét dữ liệu.</div>
    </div>
</div>

<!-- Bạn chỉ cần thay thế phần <script> cũ trong file của bạn bằng đoạn dưới đây -->
<script>
    const labels = {
        uid: "Mã Thành Viên (UID)", gender: "Giới Tính", country: "Quốc Gia",
        birthdate: "Ngày Sinh", location: "Vị Trí", aboutme: "Giới Thiệu",
        warning_level: "Cảnh Báo", age: "Tuổi", last_login: "Đăng Nhập Gần Nhất"
    };

    function checkEnterKey(event) {
        if (event.key === "Enter") startPaltalkRequest();
    }

    async function startPaltalkRequest() {
        const inputVal = document.getElementById('usernameInput').value.trim();
        const resultZone = document.getElementById('resultZone');

        if (!inputVal) return alert("Vui lòng nhập tên tài khoản!");

        resultZone.innerHTML = '<div class="status-msg">Đang kết nối tới Paltalk API...</div>';

        const url = `https://www.paltalk.com/people/api/people/searchUsers/?keyword=${encodeURIComponent(inputVal)}&country=WW&gender=&fromAge=18&toAge=99&offset=0`;

        try {
            const response = await fetch(url, {
                method: 'GET',
                credentials: 'include', // Gửi kèm Cookie trình duyệt của bạn
                headers: { 'Accept': 'application/json' }
            });

            if (!response.ok) throw new Error('Không thể truy cập API');

            const json = await response.json();

            if (json && json.data && json.data.members && json.data.members.length > 0) {
                renderBeautifulCard(json.data.members[0]);
            } else {
                resultZone.innerHTML = '<div class="status-msg">Không tìm thấy tài khoản này!</div>';
            }
        } catch (error) {
            resultZone.innerHTML = `<div class="status-msg" style="color:red;">
                Lỗi: Không lấy được dữ liệu.<br>
                1. Hãy chắc chắn bạn đã <b>đăng nhập Paltalk</b> trên trình duyệt này.<br>
                2. Phải chạy file qua <b>Live Server</b> (không dùng file:///).
            </div>`;
        }
    }

    function renderBeautifulCard(member) {

        // Lưu ý: Đảm bảo code của hàm này vẫn nằm trong thẻ <script>

        // ... [Giữ nguyên logic dựng giao diện của bạn tại đây] ...
    }
</script>

</body>
</html>
