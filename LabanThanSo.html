<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đại Thuật La Kinh Phong Thủy Tối Thượng</title>
    <style>
        :root {
            --gold: #dfb76c;
            --dark: #070707;
            --panel: #121212;
            --text: #e0e0e0;
            --red: #ff3b30;
            --green: #30d158;
        }
        body { margin:0; padding:0; background:var(--dark); color:var(--text); font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow-x:hidden; }
        .header { text-align:center; padding:15px; border-bottom:2px solid var(--gold); width:100%; background:linear-gradient(180deg,#1f1a10 0%,var(--dark)100%); box-shadow:0 4px 15px rgba(0,0,0,0.5); }
        .header h1 { color:var(--gold); font-size:1.25rem; margin:0; text-transform:uppercase; letter-spacing:1.5px; }

        .panel { width:90%; max-width:460px; background:#1a1510; border:1px solid #443322; padding:15px; border-radius:10px; margin:12px 0; box-sizing:border-box; }
        .form-grid { display:grid; grid-template-columns:1.2fr 0.8fr; gap:12px; }
        label { font-size:0.85rem; color:var(--gold); margin-bottom:5px; display:block; }
        input, select { background:#2a2218; border:1px solid var(--gold); color:#fff; padding:9px; border-radius:6px; width:100%; }

        .compass-container { position:relative; width:340px; height:340px; margin:20px auto; }
        .compass-dial { width:100%; height:100%; border:8px double var(--gold); border-radius:50%; background:radial-gradient(circle,#222 0%,#050505 70%,#111 100%); box-shadow:0 0 30px rgba(223,183,108,0.25); transition:transform 0.1s ease-out; }
        .center-needle { position:absolute; width:14px; height:92%; background:linear-gradient(to bottom,var(--red)50%,#ddd 50%); clip-path:polygon(50% 0%,100%15%,60%15%,60%85%,100%85%,50%100%,0%85%,40%85%,40%15%,0%15%); z-index:3; }
        .center-pin { position:absolute; width:18px; height:18px; background:var(--gold); border-radius:50%; z-index:5; box-shadow:0 0 12px rgba(0,0,0,0.9); }

        .status-panel { text-align:center; }
        .degree-display { font-size:1.45rem; color:var(--gold); font-weight:bold; }
        .judgment-badge { padding:8px 20px; border-radius:25px; font-weight:bold; font-size:1.1rem; margin:8px 0; display:inline-block; }
        .bg-good { background:rgba(48,209,88,0.25); color:var(--green); border:1px solid var(--green); }
        .bg-bad { background:rgba(255,59,48,0.25); color:var(--red); border:1px solid var(--red); }

        .history-item { background:#222; padding:10px; margin:6px 0; border-radius:6px; font-size:0.9rem; }
        button { background:#2a2218; color:var(--gold); border:1px solid var(--gold); padding:10px 16px; border-radius:8px; cursor:pointer; }
        .active { background:var(--gold); color:#000; }
    </style>
</head>
<body>

<div class="header"><h1>ĐẠI THUẬT LA KINH PHONG THỦY TỐI THƯỢNG</h1></div>

<div class="panel">
    <label>Chọn tuổi:</label>
    <select id="profile-select" onchange="loadProfile()" style="width:100%"></select>
    <div style="margin-top:8px;display:flex;gap:5px">
        <input type="text" id="new-name" placeholder="Tên" style="flex:1">
        <input type="date" id="new-date" style="flex:1">
        <select id="new-gender">
            <option value="male">Nam</option>
            <option value="female">Nữ</option>
        </select>
        <button onclick="addProfile()">Thêm</button>
    </div>
</div>

<div class="panel">
    <label>Mục đích:</label>
    <select id="purpose" onchange="updateCompassUI(currentHeading)">
        <option value="house">Nhà / Cửa Chính</option>
        <option value="altar">Bàn Thờ</option>
        <option value="bed">Giường Ngủ</option>
        <option value="kitchen">Bếp Nấu</option>
        <option value="toilet">Nhà Vệ Sinh / WC</option>
    </select>
</div>

<div class="compass-container">
    <div class="compass-dial" id="compass"></div>
    <div class="center-needle" id="needle"></div>
    <div class="center-pin"></div>
</div>

<button id="permission-btn" onclick="requestPermission()">KÍCH HOẠT SENSOR LA BÀN</button>

<div class="panel status-panel">
    <div class="degree-display" id="degree-txt">0° — KHẢM (BẮC)</div>
    <div class="fate-display" id="fate-txt">Mệnh chủ: ...</div>
    <div id="judgment-box" class="judgment-badge bg-good">...</div>
    <div id="ngu-hanh-info" style="margin-top:8px;font-size:0.9rem;color:#ccc"></div>
</div>

<div class="panel">
    <p class="panel-title">LUẬN GIẢI CÁT HUNG</p>
    <div class="detail-content" id="detail-box" style="min-height:130px"></div>
</div>

<div class="panel">
    <button onclick="saveCurrentMeasurement()" style="width:100%">💾 Lưu đo hướng hiện tại</button>
</div>

<div class="panel">
    <p style="color:var(--gold)">Lịch sử đo hướng:</p>
    <div id="history-list"></div>
</div>

<script>
// ================== 24 SƠN + NGŨ HÀNH ==================
const son24 = [
    {deg:0,name:"Tý",trigram:"Khảm",nguHanh:"Thủy"},{deg:15,name:"Quý",trigram:"Khảm",nguHanh:"Thủy"},
    {deg:30,name:"Sửu",trigram:"Cấn",nguHanh:"Thổ"},{deg:45,name:"Cấn",trigram:"Cấn",nguHanh:"Thổ"},
    {deg:60,name:"Dần",trigram:"Cấn",nguHanh:"Mộc"},{deg:75,name:"Giáp",trigram:"Chấn",nguHanh:"Mộc"},
    {deg:90,name:"Mão",trigram:"Chấn",nguHanh:"Mộc"},{deg:105,name:"Ất",trigram:"Chấn",nguHanh:"Mộc"},
    {deg:120,name:"Thìn",trigram:"Tốn",nguHanh:"Thổ"},{deg:135,name:"Tốn",trigram:"Tốn",nguHanh:"Mộc"},
    {deg:150,name:"Tỵ",trigram:"Tốn",nguHanh:"Hỏa"},{deg:165,name:"Bính",trigram:"Ly",nguHanh:"Hỏa"},
    {deg:180,name:"Ngọ",trigram:"Ly",nguHanh:"Hỏa"},{deg:195,name:"Đinh",trigram:"Ly",nguHanh:"Hỏa"},
    {deg:210,name:"Mùi",trigram:"Khôn",nguHanh:"Thổ"},{deg:225,name:"Khôn",trigram:"Khôn",nguHanh:"Thổ"},
    {deg:240,name:"Thân",trigram:"Khôn",nguHanh:"Kim"},{deg:255,name:"Canh",trigram:"Đoài",nguHanh:"Kim"},
    {deg:270,name:"Dậu",trigram:"Đoài",nguHanh:"Kim"},{deg:285,name:"Tân",trigram:"Đoài",nguHanh:"Kim"},
    {deg:300,name:"Tuất",trigram:"Càn",nguHanh:"Thổ"},{deg:315,name:"Càn",trigram:"Càn",nguHanh:"Kim"},
    {deg:330,name:"Hợi",trigram:"Càn",nguHanh:"Thủy"},{deg:345,name:"Nhâm",trigram:"Khảm",nguHanh:"Thủy"}
];

const bátTrạchMap = { /* giữ nguyên từ file gốc */ 
    'Khảm': { 'N': 'Phục Vị', 'NE': 'Ngũ Quỷ', 'E': 'Thiên Y', 'SE': 'Sinh Khí', 'S': 'Diên Niên', 'SW': 'Tuyệt Mệnh', 'W': 'Họa Hại', 'NW': 'Lục Sát', 'group': 'Đông Tứ Mệnh' },
    'Ly':   { 'N': 'Diên Niên', 'NE': 'Họa Hại', 'E': 'Sinh Khí', 'SE': 'Thiên Y', 'S': 'Phục Vị', 'SW': 'Lục Sát', 'W': 'Ngũ Quỷ', 'NW': 'Tuyệt Mệnh', 'group': 'Đông Tứ Mệnh' },
    'Chấn': { 'N': 'Thiên Y', 'NE': 'Lục Sát', 'E': 'Phục Vị', 'SE': 'Diên Niên', 'S': 'Sinh Khí', 'SW': 'Họa Hại', 'W': 'Tuyệt Mệnh', 'NW': 'Ngũ Quỷ', 'group': 'Đông Tứ Mệnh' },
    'Tốn':  { 'N': 'Sinh Khí', 'NE': 'Tuyệt Mệnh', 'E': 'Diên Niên', 'SE': 'Phục Vị', 'S': 'Thiên Y', 'SW': 'Ngũ Quỷ', 'W': 'Lục Sát', 'NW': 'Họa Hại', 'group': 'Đông Tứ Mệnh' },
    'Càn':  { 'N': 'Lục Sát', 'NE': 'Thiên Y', 'E': 'Ngũ Quỷ', 'SE': 'Họa Hại', 'S': 'Tuyệt Mệnh', 'SW': 'Diên Niên', 'W': 'Sinh Khí', 'NW': 'Phục Vị', 'group': 'Tây Tứ Mệnh' },
    'Khôn': { 'N': 'Tuyệt Mệnh', 'NE': 'Sinh Khí', 'E': 'Họa Hại', 'SE': 'Ngũ Quỷ', 'S': 'Lục Sát', 'SW': 'Phục Vị', 'W': 'Thiên Y', 'NW': 'Diên Niên', 'group': 'Tây Tứ Mệnh' },
    'Đoài': { 'N': 'Họa Hại', 'NE': 'Diên Niên', 'E': 'Tuyệt Mệnh', 'SE': 'Lục Sát', 'S': 'Ngũ Quỷ', 'SW': 'Thiên Y', 'W': 'Phục Vị', 'NW': 'Sinh Khí', 'group': 'Tây Tứ Mệnh' },
    'Cấn':  { 'N': 'Ngũ Quỷ', 'NE': 'Phục Vị', 'E': 'Lục Sát', 'SE': 'Họa Hại', 'S': 'Họa Hại', 'SW': 'Sinh Khí', 'W': 'Diên Niên', 'NW': 'Thiên Y', 'group': 'Tây Tứ Mệnh' }
};

const cungPhầnTrăm = { /* giữ nguyên */ 
    'Sinh Khí': { cát: true, ý_nghĩa: 'Cung Đại Cát, chủ về tài lộc dồi dào...' },
    'Thiên Y': { cát: true, ý_nghĩa: 'Cung Trung Cát, chủ về sức khỏe...' },
    'Diên Niên': { cát: true, ý_nghĩa: 'Cung Cát, chủ về quan hệ...' },
    'Phục Vị': { cát: true, ý_nghĩa: 'Cung Tiểu Cát...' },
    'Tuyệt Mệnh': { cát: false, ý_nghĩa: 'Cung Đại Hung...' },
    'Ngũ Quỷ': { cát: false, ý_nghĩa: 'Cung Hung...' },
    'Lục Sát': { cát: false, ý_nghĩa: 'Cung Hung...' },
    'Họa Hại': { cát: false, ý_nghĩa: 'Cung Tiểu Hung...' }
};

let profiles = [];
let currentProfile = null;
let currentHeading = 0;
let currentSon = null;

function getSon24(deg) {
    let best = son24[0];
    let minDiff = 360;
    for (let s of son24) {
        let diff = Math.min(Math.abs(deg - s.deg), 360 - Math.abs(deg - s.deg));
        if (diff < minDiff) { minDiff = diff; best = s; }
    }
    return best;
}

function tinhCungPhiTiếtKhí(dateString, gioiTinh) {
    const d = new Date(dateString);
    if (isNaN(d.getTime())) return 'Khảm';
    let nam = d.getFullYear();
    const thang = d.getMonth() + 1;
    const ngay = d.getDate();
    if (thang === 1 || (thang === 2 && ngay < 5)) nam--;
    let soDu = nam % 9 || 9;
    if (gioiTinh === 'male') {
        let kq = (11 - soDu) % 9 || 9;
        const m = {1:'Khảm',2:'Khôn',3:'Chấn',4:'Tốn',5:'Khôn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'};
        return m[kq];
    } else {
        let kq = (soDu + 4) % 9 || 9;
        const m = {1:'Tốn',2:'Khôn',3:'Chấn',4:'Khôn',5:'Cấn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'};
        return m[kq];
    }
}

// Profile management
function loadProfiles() {
    const saved = localStorage.getItem('phongthuy_profiles');
    profiles = saved ? JSON.parse(saved) : [{id:1,name:"Mẫu",date:"1990-01-01",gender:"male"}];
    renderProfiles();
}

function saveProfiles() {
    localStorage.setItem('phongthuy_profiles', JSON.stringify(profiles));
}

function renderProfiles() {
    const sel = document.getElementById('profile-select');
    sel.innerHTML = '';
    profiles.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.name} (${p.date})`;
        sel.appendChild(opt);
    });
    if (profiles.length) loadProfile();
}

function addProfile() {
    const name = document.getElementById('new-name').value.trim() || "Người dùng";
    const date = document.getElementById('new-date').value || "1990-01-01";
    const gender = document.getElementById('new-gender').value;
    const id = Date.now();
    profiles.push({id, name, date, gender});
    saveProfiles();
    renderProfiles();
}

function loadProfile() {
    const id = parseInt(document.getElementById('profile-select').value);
    currentProfile = profiles.find(p => p.id === id);
    if (currentProfile) {
        document.getElementById('fate-txt').innerText = `Mệnh chủ: ${tinhCungPhiTiếtKhí(currentProfile.date, currentProfile.gender)} (${currentProfile.name})`;
        updateCompassUI(currentHeading);
    }
}

// La bàn
function updateCompassUI(heading) {
    currentHeading = Math.round(heading % 360);
    document.getElementById('compass').style.transform = `rotate(${-currentHeading}deg)`;
    document.getElementById('compassSlider').value = currentHeading;

    currentSon = getSon24(currentHeading);
    const chuMenh = currentProfile ? tinhCungPhiTiếtKhí(currentProfile.date, currentProfile.gender) : 'Khảm';
    const code8 = currentSon.trigram === 'Khảm' ? 'N' : /* simplified */ currentSon.deg < 90 ? 'E' : currentSon.deg < 180 ? 'S' : currentSon.deg < 270 ? 'W' : 'N';
    const cungTrach = bátTrạchMap[chuMenh]?.[code8] || 'Phục Vị';

    document.getElementById('degree-txt').innerText = `${currentHeading}° — ${currentSon.name} (${currentSon.trigram} - ${currentSon.nguHanh})`;
    document.getElementById('ngu-hanh-info').innerHTML = `Ngũ Hành: <b>${currentSon.nguHanh}</b>`;

    const info = cungPhầnTrăm[cungTrach] || {cát:true, ý_nghĩa:''};
    const purpose = document.getElementById('purpose').value;

    const judgmentBox = document.getElementById('judgment-box');
    const detailBox = document.getElementById('detail-box');

    judgmentBox.innerText = cungTrach;
    judgmentBox.className = info.cát ? "judgment-badge bg-good" : "judgment-badge bg-bad";

    let html = `<b>24 Sơn:</b> ${currentSon.name} ${currentSon.nguHanh}<br><b>Bát Trạch:</b> ${cungTrach}<br><br>`;
    html += info.ý_nghĩa + "<br><br>";

    if (purpose === 'kitchen' || purpose === 'toilet') {
        html += !info.cát ? "◆ **TỐT** để đặt (Tọa Hung)" : "◆ **XẤU** - Không nên đặt";
    } else {
        html += info.cát ? "◆ **Hướng Tốt**" : "◆ **Hướng Xấu**";
    }
    detailBox.innerHTML = html;
}

function handleOrientation(event) {
    let heading = event.webkitCompassHeading || (event.alpha ? (360 - event.alpha) : null);
    if (heading !== null) updateCompassUI(heading);
}

function requestPermission() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(r => {
            if (r === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation);
                document.getElementById('permission-btn').style.display = 'none';
            }
        });
    }
}

function saveCurrentMeasurement() {
    if (!currentSon) return;
    let history = JSON.parse(localStorage.getItem('phongthuy_history') || '[]');
    history.unshift({
        time: new Date().toLocaleString('vi-VN'),
        deg: currentHeading,
        son: currentSon.name,
        nguHanh: currentSon.nguHanh,
        batTrach: document.getElementById('judgment-box').innerText
    });
    if (history.length > 15) history.pop();
    localStorage.setItem('phongthuy_history', JSON.stringify(history));
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('history-list');
    const history = JSON.parse(localStorage.getItem('phongthuy_history') || '[]');
    list.innerHTML = history.map(h => `
        <div class="history-item">
            <small>${h.time}</small><br>
            ${h.deg}° — ${h.son} (${h.nguHanh}) → ${h.batTrach}
        </div>
    `).join('');
}

function manualRotate(v) { updateCompassUI(v); }

// Init
window.addEventListener('DOMContentLoaded', () => {
    loadProfiles();
    renderHistory();
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.getElementById('permission-btn').style.display = 'block';
    } else {
        window.addEventListener('deviceorientation', handleOrientation);
    }
    updateCompassUI(0);
});
</script>
</body>
</html>
