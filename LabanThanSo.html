<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Bàn Phong Thủy Toàn Diện</title>
    <style>
        :root {
            --primary-color: #ff6600; /* Màu cam chủ đạo theo thiết kế thương hiệu */
            --bg-color: #f9f9f9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h2 {
            margin-bottom: 15px;
            color: #222;
        }

        /* Khung nhập tên thông minh */
        .input-group {
            margin-bottom: 20px;
            width: 100%;
            max-width: 350px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* Khu vực hiển thị La Bàn */
        .compass-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
        }

        /* Mặt la bàn xoay */
        .compass-dial {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #333;
            background: #fff url('https://i.imgur.com/K7M7B7a.png') no-repeat center/contain; /* Thay bằng link ảnh mặt la bàn thật của bạn */
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.1s ease-out;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Biểu tượng Âm Dương chìm ở tâm */
        .compass-dial::before {
            content: "";
            width: 50px;
            height: 50px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/7c/Yin_and_yang.svg') no-repeat center/contain;
            opacity: 0.15;
            position: absolute;
        }

        /* Kim vàng ảo (Chỉ hướng cố định - Mờ) */
        .virtual-needle {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 6px;
            height: 150px;
            background: linear-gradient(to bottom, rgba(255, 204, 0, 0.8) 50%, transparent 50%);
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none; /* Không cản trở tương tác vuốt góc */
            display: none; /* Mặc định ẩn, chỉ hiện khi bấm Xoay thử */
        }
        /* Mũi tên nhọn của kim vàng ảo */
        .virtual-needle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid rgba(255, 204, 0, 0.9);
        }

        /* Khung chọn hạng mục Nhà Cửa */
        .house-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #fff;
            border: 1.5px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .option-btn.active {
            border-color: var(--primary-color);
            background-color: rgba(255, 102, 0, 0.05);
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Khu vực nút điều khiển chính */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        button.main-btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        /* Nút Xoay thử */
        .btn-try {
            background-color: #333;
            color: #fff;
        }
        .btn-try:active {
            transform: scale(0.97);
        }

        /* Nút Làm mới (Đã tối ưu: Sáng rõ, có hiệu ứng thực thi) */
        .btn-reset {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng Phóng to nhẹ khi di chuột/chạm */
        .btn-reset:hover {
            background-color: #e05500;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 102, 0, 0.4);
        }

        /* Hiệu ứng sóng lan tỏa (Ripple) rõ ràng khi bấm vào */
        .btn-reset:active {
            transform: scale(0.95);
            background-color: #cc4e00;
        }

        /* Hiệu ứng xoay tròn biểu tượng hoặc trạng thái đang thực thi */
        .btn-reset.executing {
            animation: pulse-effect 0.4s ease-in-out;
        }

        @keyframes pulse-effect {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(0.92); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Khu vực hiển thị thông tin mô tả chi tiết dưới la bàn */
        .info-panel {
            margin-top: 15px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            font-size: 15px;
            min-height: 40px;
            color: #555;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h2>La Bàn Phong Thủy</h2>

    <div class="input-group">
        <input type="text" id="username" value="Ví dụ: Nguyễn Văn A" onfocus="clearPlaceholder(this)" onblur="restorePlaceholder(this)">
    </div>

    <div class="compass-container">
        <div class="virtual-needle" id="virtualNeedle"></div>
        <div class="compass-dial" id="compassDial">
            </div>
    </div>

    <div class="info-panel" id="infoPanel">Chưa xác định hướng - Vui lòng xoay la bàn</div>

    <div class="house-options" id="houseOptions">
        <div class="option-btn" onclick="toggleOption(this, 'Bàn thờ')">Bàn thờ</div>
        <div class="option-btn" onclick="toggleOption(this, 'Giường ngủ')">Giường ngủ</div>
        <div class="option-btn" onclick="toggleOption(this, 'Toilet')">Toilet</div>
        <div class="option-btn" onclick="toggleOption(this, 'Bếp nấu ăn')">Bếp nấu ăn</div>
        <div class="option-btn" onclick="toggleOption(this, 'Bàn làm việc')">Bàn làm việc</div>
    </div>

    <div class="controls">
        <button class="main-btn btn-try" onclick="enableVirtualGuide()">Xoay thử</button>
        <button class="main-btn btn-reset" id="btnReset" onclick="resetPage()">Làm mới trang</button>
    </div>

    <script>
        let currentAngle = 0;
        const compassDial = document.getElementById('compassDial');
        const virtualNeedle = document.getElementById('virtualNeedle');
        const infoPanel = document.getElementById('infoPanel');
        const usernameInput = document.getElementById('username');
        const defaultPlaceholder = "Ví dụ: Nguyễn Văn A";

        // 1. Xử lý Ô nhập tên thông minh (Bấm vào là mất chữ ví dụ ngay lập tức)
        function clearPlaceholder(input) {
            if (input.value === defaultPlaceholder) {
                input.value = "";
                input.style.color = "#000"; // Đổi màu chữ đậm khi gõ thật
            }
        }

        function restorePlaceholder(input) {
            if (input.value.trim() === "") {
                input.value = defaultPlaceholder;
                input.style.color = "#888"; // Đổi màu chữ mờ cho chữ ví dụ
            }
        }
        // Thiết lập màu chữ mờ ban đầu cho chữ ví dụ
        usernameInput.style.color = "#888"; 


        // 2. Logic Xoay thử: Hiện kim vàng ảo cố định định hướng nhanh
        function enableVirtualGuide() {
            // Hiện kim vàng ảo
            virtualNeedle.style.display = 'block';
            
            // Giả lập đưa la bàn về một hướng mục tiêu ngẫu nhiên nhanh để làm mốc (ví dụ 120 độ Đông Nam)
            currentAngle = 120; 
            compassDial.style.transform = `rotate(${-currentAngle}deg)`;
            
            updateDirectionText(currentAngle);
            
            // Thông báo trải nghiệm cho người dùng biết để tự xoay tiếp
            infoPanel.innerHTML = " Đã bật Kim Vàng định hướng. Hãy tự xoay thiết bị/mặt la bàn cho đúng ý bạn.";
        }

        // Cập nhật text hiển thị hướng dựa trên số góc xoay
        function updateDirectionText(angle) {
            let normalizedAngle = (angle % 360 + 360) % 360;
            let direction = "";
            
            if (normalizedAngle >= 337.5 || normalizedAngle < 22.5) direction = "Hướng Bắc (N)";
            else if (normalizedAngle >= 22.5 && normalizedAngle < 67.5) direction = "Hướng Đông Bắc (NE)";
            else if (normalizedAngle >= 67.5 && normalizedAngle < 112.5) direction = "Hướng Đông (E)";
            else if (normalizedAngle >= 112.5 && normalizedAngle < 157.5) direction = "Hướng Đông Nam (SE)";
            else if (normalizedAngle >= 157.5 && normalizedAngle < 202.5) direction = "Hướng Nam (S)";
            else if (normalizedAngle >= 202.5 && normalizedAngle < 247.5) direction = "Hướng Tây Nam (SW)";
            else if (normalizedAngle >= 247.5 && normalizedAngle < 292.5) direction = "Hướng Tây (W)";
            else if (normalizedAngle >= 292.5 && normalizedAngle < 337.5) direction = "Hướng Tây Bắc (NW)";
            
            infoPanel.innerText = `${direction} - ${Math.round(normalizedAngle)}°`;
        }


        // 3. Chọn hạng mục đồ đạc nhà cửa
        function toggleOption(element, name) {
            // Bỏ chọn các mục khác (chỉ cho phép chọn một mục tại một thời điểm để chính xác)
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
            
            // Bật mục được chọn
            element.classList.add('active');
            infoPanel.innerText = `Đang xem phong thủy cho: ${name}`;
        }


        // 4. Logic Nút LÀM MỚI TRANG (Xóa sạch, không số, không khung, chế độ chuẩn)
        function resetPage() {
            const btnReset = document.getElementById('btnReset');
            
            // Kích hoạt hiệu ứng phản hồi thị giác (đang thực thi)
            btnReset.classList.add('executing');
            
            setTimeout(() => {
                btnReset.classList.remove('executing');
            }, 400);

            // Xóa sạch thông tin đăng nhập/tên về mặc định
            usernameInput.value = defaultPlaceholder;
            usernameInput.style.color = "#888";

            // Ẩn hoàn toàn kim vàng ảo
            virtualNeedle.style.display = 'none';

            // Reset mặt la bàn về vị trí 0 độ ban đầu
            currentAngle = 0;
            compassDial.style.transform = 'rotate(0deg)';

            // Bỏ chọn toàn bộ tất cả các khung chọn nhà cửa
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));

            // Đưa bảng thông tin về trạng thái trống thuần túy ban đầu để ngầm hiểu đang ở chế độ xem chính xác
            infoPanel.innerText = "Chưa xác định hướng - Vui lòng xoay la bàn";
        }

        // Tích hợp giả lập vuốt để xoay la bàn tay (Dành cho kiểm thử trên trình duyệt/điện thoại)
        let isDragging = false;
        let startAngle = 0;

        compassDial.addEventListener('mousedown', startRotate);
        compassDial.addEventListener('touchstart', startRotate);
        window.addEventListener('mousemove', rotate);
        window.addEventListener('touchmove', rotate);
        window.addEventListener('mouseup', stopRotate);
        window.addEventListener('touchend', stopRotate);

        function startRotate(e) {
            isDragging = true;
            const rect = compassDial.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startAngle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI) - currentAngle;
        }

        function rotate(e) {
            if (!isDragging) return;
            const rect = compassDial.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const angle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
            currentAngle = angle - startAngle;
            
            compassDial.style.transform = `rotate(${currentAngle}deg)`;
            updateDirectionText(-currentAngle);
        }

        function stopRotate() {
            isDragging = false;
        }
    </script>
</body>
</html>
