<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đại Thuật La Kinh Phong Thủy Tối Thượng</title>
    <style>
        :root {
            --gold: #dfb76c;
            --dark: #070707;
            --panel: #121212;
            --text: #e0e0e0;
            --red: #ff3b30;
            --green: #30d158;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }
        .header { text-align: center; padding: 15px; border-bottom: 2px solid var(--gold); width: 100%;
            background: linear-gradient(180deg, #1f1a10 0%, var(--dark) 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header h1 { color: var(--gold); font-size: 1.25rem; margin: 0; text-transform: uppercase; letter-spacing: 1.5px; }

        .user-input-panel, .status-panel, .explanation-panel, .control-box {
            width: 90%; max-width: 460px; background: #1a1510; border: 1px solid #443322;
            padding: 15px; border-radius: 10px; margin-top: 12px; box-sizing: border-box;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group label { font-size: 0.82rem; color: var(--gold); margin-bottom: 5px; }
        .form-group input, .form-group select {
            background: #2a2218; border: 1px solid var(--gold); color: #fff;
            padding: 9px; border-radius: 5px; font-size: 0.95rem;
        }

        .compass-container {
            position: relative; width: 340px; height: 340px; margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
        }
        .compass-dial {
            width: 100%; height: 100%; border: 8px double var(--gold); border-radius: 50%;
            background: radial-gradient(circle, #222 0%, #050505 65%, #111 100%);
            box-shadow: 0 0 30px rgba(223, 183, 108, 0.25);
            transition: transform 0.08s ease-out;
        }
        .center-needle {
            position: absolute; width: 14px; height: 92%; z-index: 3;
            background: linear-gradient(to bottom, var(--red) 50%, #ddd 50%);
            clip-path: polygon(50% 0%, 100% 12%, 60% 12%, 60% 88%, 100% 88%, 50% 100%, 0% 88%, 40% 88%, 40% 12%, 0% 12%);
        }
        .center-pin { position: absolute; width: 18px; height: 18px; background: var(--gold); border-radius: 50%; z-index: 5; box-shadow: 0 0 12px rgba(0,0,0,0.9); }

        .direction-label {
            position: absolute; font-weight: bold; font-size: 0.78rem; text-align: center; width: 68px;
            transform-origin: center center; pointer-events: none;
        }

        .status-panel { text-align: center; border: 1px solid var(--gold); }
        .degree-display { font-size: 1.45rem; color: var(--gold); font-weight: bold; margin: 8px 0; }
        .judgment-badge { padding: 8px 20px; border-radius: 25px; font-weight: bold; font-size: 1.05rem; margin: 8px 0; }

        .toggle-group { display: flex; gap: 8px; margin: 10px 0; justify-content: center; }
        .toggle-btn {
            padding: 8px 16px; border-radius: 20px; background: #2a2218; border: 1px solid var(--gold);
            color: var(--text); cursor: pointer;
        }
        .toggle-btn.active { background: var(--gold); color: #000; font-weight: bold; }

        .bg-good { background: rgba(48,209,88,0.2); color: var(--green); border: 1px solid var(--green); }
        .bg-bad { background: rgba(255,59,48,0.2); color: var(--red); border: 1px solid var(--red); }
    </style>
</head>
<body>

<div class="header"><h1>ĐẠI THUẬT LA KINH PHONG THỦY TỐI THƯỢNG</h1></div>

<div class="user-input-panel">
    <div class="form-grid">
        <div class="form-group">
            <label>Năm sinh:</label>
            <input type="number" id="birthYear" value="1990" min="1930" max="2026" onchange="recalculateFate()">
        </div>
        <div class="form-group">
            <label>Giới tính:</label>
            <select id="gender" onchange="recalculateFate()">
                <option value="male">Nam Mạng</option>
                <option value="female">Nữ Mạng</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label>Mục đích:</label>
        <select id="purpose" onchange="updateCompassUI(currentHeading)">
            <option value="house">Nhà • Cửa Chính • Bàn Thờ</option>
            <option value="kitchen">Đặt Bếp (Tọa Hung Hướng Cát)</option>
        </select>
    </div>
</div>

<div class="compass-container">
    <div class="compass-dial" id="compass"></div>
    <div class="center-needle" id="needle"></div>
    <div class="center-pin"></div>
</div>

<div class="toggle-group">
    <button class="toggle-btn active" id="mode-back" onclick="setMode('back')">📱 Camera Sau</button>
    <button class="toggle-btn" id="mode-front" onclick="setMode('front')">🤳 Camera Trước</button>
</div>

<button id="permission-btn" onclick="requestPermission()">KÍCH HOẠT LA BÀN</button>

<div class="status-panel">
    <div class="degree-display" id="degree-txt">0° — BẮC (KHẢM)</div>
    <div class="fate-display" id="fate-txt">Mệnh: Khảm Thủy (Đông Tứ Mệnh)</div>
    <div id="judgment-box" class="judgment-badge bg-good">SINH KHÍ — ĐẠI CÁT</div>
</div>

<div class="control-box" style="text-align:center">
    <input type="range" min="0" max="360" value="0" id="compassSlider" oninput="manualRotate(this.value)" style="width:90%">
    <button onclick="resetCompass()" style="margin-top:8px; padding:8px 16px; background:#333; color:#fff; border:none; border-radius:6px;">⟳ Reset La Bàn</button>
</div>

<div class="explanation-panel">
    <p class="panel-title">LUẬN GIẢI CÁT HUNG</p>
    <div class="detail-content" id="detail-box">Đang phân tích...</div>
</div>

<script>
// ================== DỮ LIỆU ==================
const bátTrạchMap = { /* giữ nguyên như cũ */ 
    'Khảm': { 'N': 'Phục Vị', 'NE': 'Ngũ Quỷ', 'E': 'Thiên Y', 'SE': 'Sinh Khí', 'S': 'Diên Niên', 'SW': 'Tuyệt Mệnh', 'W': 'Họa Hại', 'NW': 'Lục Sát', 'group': 'Đông Tứ Mệnh' },
    'Ly':   { 'N': 'Diên Niên', 'NE': 'Họa Hại', 'E': 'Sinh Khí', 'SE': 'Thiên Y', 'S': 'Phục Vị', 'SW': 'Lục Sát', 'W': 'Ngũ Quỷ', 'NW': 'Tuyệt Mệnh', 'group': 'Đông Tứ Mệnh' },
    'Chấn': { 'N': 'Thiên Y', 'NE': 'Lục Sát', 'E': 'Phục Vị', 'SE': 'Diên Niên', 'S': 'Sinh Khí', 'SW': 'Họa Hại', 'W': 'Tuyệt Mệnh', 'NW': 'Ngũ Quỷ', 'group': 'Đông Tứ Mệnh' },
    'Tốn':  { 'N': 'Sinh Khí', 'NE': 'Tuyệt Mệnh', 'E': 'Diên Niên', 'SE': 'Phục Vị', 'S': 'Thiên Y', 'SW': 'Ngũ Quỷ', 'W': 'Lục Sát', 'NW': 'Họa Hại', 'group': 'Đông Tứ Mệnh' },
    'Càn':  { 'N': 'Lục Sát', 'NE': 'Thiên Y', 'E': 'Ngũ Quỷ', 'SE': 'Họa Hại', 'S': 'Tuyệt Mệnh', 'SW': 'Diên Niên', 'W': 'Sinh Khí', 'NW': 'Phục Vị', 'group': 'Tây Tứ Mệnh' },
    'Khôn': { 'N': 'Tuyệt Mệnh', 'NE': 'Sinh Khí', 'E': 'Họa Hại', 'SE': 'Ngũ Quỷ', 'S': 'Lục Sát', 'SW': 'Phục Vị', 'W': 'Thiên Y', 'NW': 'Diên Niên', 'group': 'Tây Tứ Mệnh' },
    'Đoài': { 'N': 'Họa Hại', 'NE': 'Diên Niên', 'E': 'Tuyệt Mệnh', 'SE': 'Lục Sát', 'S': 'Ngũ Quỷ', 'SW': 'Thiên Y', 'W': 'Phục Vị', 'NW': 'Sinh Khí', 'group': 'Tây Tứ Mệnh' },
    'Cấn':  { 'N': 'Ngũ Quỷ', 'NE': 'Phục Vị', 'E': 'Lục Sát', 'SE': 'Họa Hại', 'S': 'Họa Hại', 'SW': 'Sinh Khí', 'W': 'Diên Niên', 'NW': 'Thiên Y', 'group': 'Tây Tứ Mệnh' }
};

const cungPhầnTrăm = { /* giữ nguyên */ 
    'Sinh Khí': { cát: true, ý_nghĩa: 'Đại Cát - Tài lộc, sự nghiệp thăng tiến mạnh.' },
    'Thiên Y': { cát: true, ý_nghĩa: 'Trung Cát - Sức khỏe, quý nhân phù trợ.' },
    'Diên Niên': { cát: true, ý_nghĩa: 'Cát - Quan hệ, tình duyên tốt.' },
    'Phục Vị': { cát: true, ý_nghĩa: 'Tiểu Cát - Bình an, ổn định.' },
    'Tuyệt Mệnh': { cát: false, ý_nghĩa: 'Đại Hung - Rất nguy hiểm.' },
    'Ngũ Quỷ': { cát: false, ý_nghĩa: 'Hung - Tai họa, tiểu nhân.' },
    'Lục Sát': { cát: false, ý_nghĩa: 'Hung - Tranh chấp, thị phi.' },
    'Họa Hại': { cát: false, ý_nghĩa: 'Tiểu Hung - Vận xui vặt.' }
};

let chủMệnh = 'Khảm';
let currentHeading = 0;
let isFrontMode = false;   // Camera Trước = true

// ================== TÍNH CUNG PHI ==================
function tínhCungPhi(năm, giớiTính) {
    let sốDư = năm % 9 || 9;
    if (giớiTính === 'male') {
        let kq = (11 - sốDư) % 9 || 9;
        const map = {1:'Khảm',2:'Khôn',3:'Chấn',4:'Tốn',5:'Khôn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'};
        return map[kq];
    } else {
        let kq = (sốDư + 4) % 9 || 9;
        const map = {1:'Tốn',2:'Khôn',3:'Chấn',4:'Khôn',5:'Cấn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'};
        return map[kq];
    }
}

function recalculateFate() {
    const year = parseInt(document.getElementById('birthYear').value) || 1990;
    const gender = document.getElementById('gender').value;
    chủMệnh = tínhCungPhi(year, gender);
    document.getElementById('fate-txt').innerText = `Mệnh: ${chủMệnh} (${bátTrạchMap[chủMệnh].group})`;
    updateCompassUI(currentHeading);
}

// ================== LA BÀN ==================
function updateCompassUI(heading) {
    currentHeading = Math.round(heading % 360);
    const compass = document.getElementById('compass');
    const effectiveHeading = isFrontMode ? (currentHeading + 180) % 360 : currentHeading;
    
    compass.style.transform = `rotate(${-effectiveHeading}deg)`;

    // Xác định cung
    let currentCode = "N";
    let currentCung = "KHẢM (BẮC)";
    const h = currentHeading;

    if (h >= 338 || h < 23) { currentCung = "KHẢM (BẮC)"; currentCode = "N"; }
    else if (h >= 23 && h < 68) { currentCung = "CẤN (Đ.BẮC)"; currentCode = "NE"; }
    else if (h >= 68 && h < 113) { currentCung = "CHẤN (ĐÔNG)"; currentCode = "E"; }
    else if (h >= 113 && h < 158) { currentCung = "TỐN (Đ.NAM)"; currentCode = "SE"; }
    else if (h >= 158 && h < 203) { currentCung = "LY (NAM)"; currentCode = "S"; }
    else if (h >= 203 && h < 248) { currentCung = "KHÔN (T.NAM)"; currentCode = "SW"; }
    else if (h >= 248 && h < 293) { currentCung = "ĐOÀI (TÂY)"; currentCode = "W"; }
    else if (h >= 293 && h < 338) { currentCung = "CÀN (T.BẮC)"; currentCode = "NW"; }

    document.getElementById('degree-txt').innerText = `${currentHeading}° — ${currentCung}`;

    // Luận giải
    const cungTrạch = bátTrạchMap[chủMệnh][currentCode];
    const info = cungPhầnTrăm[cungTrạch];
    const purpose = document.getElementById('purpose').value;

    const judgmentBox = document.getElementById('judgment-box');
    const detailBox = document.getElementById('detail-box');

    if (purpose === 'house') {
        judgmentBox.innerText = cungTrạch;
        if (info.cát) {
            judgmentBox.className = "judgment-badge bg-good";
            detailBox.innerHTML = `<span style="color:#30d158">◆ HƯỚNG TỐT</span><br>${info.ý_nghĩa}<br><br><b>Khuyên dùng</b> cho cửa chính, giường, bàn thờ.`;
        } else {
            judgmentBox.className = "judgment-badge bg-bad";
            detailBox.innerHTML = `<span style="color:#ff3b30">◆ HƯỚNG XẤU</span><br>${info.ý_nghĩa}<br><br>Tránh dùng. Nên hóa giải nếu buộc phải.`;
        }
    } else {
        // Bếp
        judgmentBox.innerText = cungTrạch;
        if (!info.cát) {
            judgmentBox.className = "judgment-badge bg-good";
            detailBox.innerHTML = `<span style="color:#30d158">◆ TỐT ĐỂ ĐẶT BẾP</span><br>Tọa hung hướng cát — Rất hợp phong thủy.`;
        } else {
            judgmentBox.className = "judgment-badge bg-bad";
            detailBox.innerHTML = `<span style="color:#ff3b30">◆ KHÔNG NÊN ĐẶT BẾP</span><br>Đặt bếp ở cung tốt sẽ thiêu cháy phúc khí.`;
        }
    }
}

function handleOrientation(event) {
    let heading = 0;
    if (event.webkitCompassHeading !== undefined) {
        heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
        heading = 360 - event.alpha;
    }
    // Bù góc từ Việt Nam
    heading = (heading + 0.8) % 360;
    updateCompassUI(heading);
}

// Mode Camera
function setMode(mode) {
    isFrontMode = (mode === 'front');
    document.getElementById('mode-front').classList.toggle('active', isFrontMode);
    document.getElementById('mode-back').classList.toggle('active', !isFrontMode);
    updateCompassUI(currentHeading);
}

function requestPermission() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                    document.getElementById('permission-btn').style.display = 'none';
                }
            });
    }
}

function manualRotate(val) { updateCompassUI(val); }
function resetCompass() { updateCompassUI(0); }

// Init
window.addEventListener('DOMContentLoaded', () => {
    recalculateFate();
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.getElementById('permission-btn').style.display = 'block';
    } else {
        window.addEventListener('deviceorientation', handleOrientation);
    }
});
</script>
</body>
</html>
