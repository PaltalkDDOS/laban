<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đại Thuật La Kinh Phong Thủy Tối Thượng - Thái Thông</title>
  <style>
  :root {
    --gold: #dfb76c;
    --dark: #070707;
    --panel: #161616;
    --text: #e0e0e0;
    --red: #ff3b30;
    --green: #30d158;
    --blue: #0a84ff;
    --gray: #8e8e93;
    --orange-bright: #ff6600;
  }
  
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 30px;
    position: relative;
  }
  /* Giao diện dạng lưới sang trọng phong cách App chuyên nghiệp */
  
  .status-panel-grid {
    width: 92%;
    max-width: 430px;
    background: #111111;
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    margin: 15px auto;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.7);
  }
  
  .info-header-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid #2a2a2a;
    padding-bottom: 10px;
    margin-bottom: 10px;
    gap: 5px;
  }
  
  .info-grid-item {
    text-align: center;
  }
  
  .info-grid-item:not(:last-child) {
    border-right: 1px solid #2a2a2a;
  }
  
  .info-grid-item span {
    display: block;
    font-size: 0.72rem;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  
  .info-grid-item b {
    color: var(--gold);
    font-size: 0.95rem;
    font-weight: 600;
  }
  
  .main-result-box {
    background: #161616;
    border-left: 4px solid var(--gold);
    padding: 12px;
    border-radius: 4px;
    text-align: left;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  
  .star-warning-box {
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(255, 102, 0, 0.1);
    border: 1px solid rgba(255, 102, 0, 0.3);
    border-radius: 4px;
    font-size: 0.82rem;
    color: #ff6600;
  }
  
  .header {
    text-align: center;
    padding: 12px;
    border-bottom: 2px solid var(--gold);
    width: 100%;
    background: linear-gradient(180deg, #1f1a10 0%, var(--dark) 100%);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 10;
  }
  
  .header h1 {
    color: var(--gold);
    font-size: 1.1rem;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .header-copyright {
    color: var(--gold);
    font-size: 0.75rem;
    margin-top: 6px;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 5px rgba(223, 183, 108, 0.4);
  }
  
  .user-input-panel {
    width: 92%;
    max-width: 430px;
    background: #1a1510;
    border: 1px solid #443322;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    position: relative;
    z-index: 10;
  }
  
  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    width: 100%;
  }
  
  .form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  
  .form-group label {
    font-size: 0.75rem;
    color: var(--gold);
    margin-bottom: 4px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .form-group input,
  .form-group select {
    background: #2a2218;
    border: 1px solid var(--gold);
    color: #fff;
    padding: 8px;
    border-radius: 4px;
    font-size: 0.85rem;
    outline: none;
    height: 38px;
    width: 100%;
  }
  
  .date-input-container {
    display: flex;
    gap: 6px;
    width: 100%;
  }
  
  .date-input-container input {
    flex: 1;
    min-width: 0;
  }
  
  .btn-action-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  
  .btn-main {
    flex: 1;
    background: linear-gradient(180deg, #c5a059, #9a7b3e);
    color: #000;
    border: none;
    padding: 8px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 0.8rem;
    cursor: pointer;
    text-transform: uppercase;
  }
  
  .btn-reset {
    background: linear-gradient(180deg, var(--orange-bright), #cc5200);
    color: #fff;
    border: 1px solid #ffaa66;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(255, 102, 0, 0.3);
    transition: all 0.2s ease;
  }
  
  .saved-list-panel {
    width: 92%;
    max-width: 430px;
    background: #111;
    margin-top: 8px;
    border-radius: 6px;
    padding: 6px;
    border: 1px dashed #332211;
    position: relative;
    z-index: 10;
  }
  
  .saved-container {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  
  .saved-chip {
    background: #252018;
    border: 1px solid #554433;
    padding: 4px 8px;
    border-radius: 15px;
    font-size: 0.75rem;
    color: #ddd;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .saved-chip:hover {
    border-color: var(--gold);
  }
  
  .saved-chip .del-btn {
    color: var(--red);
    font-weight: bold;
    margin-left: 4px;
  }
  
  .compass-container {
    position: relative;
    width: 320px;
    height: 320px;
    max-width: 88vw;
    max-height: 88vw;
    margin: 15px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 10;
  }
  
  .cross-line-v {
    position: absolute;
    width: 1.5px;
    height: 100%;
    background: var(--red);
    z-index: 10;
    pointer-events: none;
  }
  
  .cross-line-h {
    position: absolute;
    width: 100%;
    height: 1px;
    background: rgba(255, 59, 48, 0.3);
    z-index: 2;
    pointer-events: none;
  }
  
  .compass-dial {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 4px double var(--gold);
    border-radius: 50%;
    background: radial-gradient(circle, #1a1a1a 0%, #050505 65%, #111 100%);
    box-shadow: 0 0 20px rgba(223, 183, 108, 0.2);
    z-index: 1;
    will-change: transform;
    transition: transform 0.2s ease-out;
  }
  
  .compass-watermark {
    position: absolute;
    bottom: 25%;
    width: 100%;
    text-align: center;
    font-size: 0.6rem;
    color: rgba(223, 183, 108, 0.3);
    font-weight: bold;
    z-index: 2;
    pointer-events: none;
    letter-spacing: 2px;
  }
  
  /* === KIM ĐỎ CHÍNH (Mạnh mẽ, sắc nét, cân đối hơn) === */
  .center-needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 87%;
    background: linear-gradient(to bottom, #ff3b30 50%, #ff6666 50%);
    clip-path: polygon(50% 0%, 100% 18%, 62% 18%, 62% 83%, 100% 83%, 50% 100%, 0% 83%, 38% 83%, 38% 18%, 0% 18%);
    transform: translate(-50%, -50%) rotate(0deg);
    transform-origin: center center;
    z-index: 9;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 59, 48, 0.8);
  }

  /* === KIM VÀNG GHOST (Chỉ 1 mũi tên, tinh tế) === */
  .ghost-needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6.5px;
    height: 84%;
    background: linear-gradient(to bottom, #ffe066 48%, #ffcc00 52%);
    clip-path: polygon(50% 0%, 100% 20%, 65% 20%, 65% 100%, 35% 100%, 0 20%, 0% 20%); /* Chỉ 1 mũi tên */
    transform: translate(-50%, -50%) rotate(0deg);
    transform-origin: center center;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.12s ease-out;
    box-shadow: 0 0 12px rgba(255, 220, 80, 0.85);
  }
  .center-pin {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--gold);
    border-radius: 50%;
    z-index: 12;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
  }
  
  .direction-label {
    position: absolute;
    font-weight: bold;
    font-size: 0.65rem;
    text-align: center;
    width: 44px;
    height: 30px;
    line-height: 1.1;
  }
  
  .lbl-kham {
    color: var(--red);
    top: 12px;
    left: calc(50% - 22px);
  }
  
  .lbl-ly {
    color: var(--gold);
    bottom: 12px;
    left: calc(50% - 22px);
    transform: rotate(180deg);
  }
  
  .lbl-chan {
    color: var(--gold);
    right: 8px;
    top: calc(50% - 15px);
    transform: rotate(90deg);
  }
  
  .lbl-doai {
    color: var(--gold);
    left: 8px;
    top: calc(50% - 15px);
    transform: rotate(-90deg);
  }
  
  .lbl-can {
    color: var(--gold);
    top: 40px;
    right: 40px;
    transform: rotate(45deg);
  }
  
  .lbl-ton {
    color: var(--gold);
    bottom: 40px;
    right: 40px;
    transform: rotate(135deg);
  }
  
  .lbl-khon {
    color: var(--gold);
    bottom: 40px;
    left: 40px;
    transform: rotate(-135deg);
  }
  
  .lbl-can2 {
    color: var(--gold);
    top: 40px;
    left: 40px;
    transform: rotate(-45deg);
  }
  
  .son-ring-text {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
  }
  
  .son-item {
    position: absolute;
    top: 0;
    left: 50%;
    width: 20px;
    margin-left: -10px;
    height: 50%;
    transform-origin: bottom center;
    font-size: 0.5rem;
    color: #8a8a8f;
    text-align: center;
    padding-top: 45px;
  }
  
  .status-panel {
    width: 92%;
    max-width: 430px;
    background: var(--panel);
    border: 1px solid var(--gold);
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 8px;
    position: relative;
    z-index: 10;
  }
  
  .degree-display {
    font-size: 1rem;
    color: var(--gold);
    font-weight: bold;
  }
  
  .element-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 4px;
    font-weight: bold;
  }
  
  .fate-display {
    font-size: 0.8rem;
    color: #fff;
    background: #222;
    padding: 6px;
    margin: 6px 0;
    border-radius: 4px;
    border-left: 4px solid var(--gold);
    text-align: left;
  }
  
  .judgment-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 0.85rem;
    margin-top: 2px;
    text-transform: uppercase;
  }
  
  .bg-good {
    background-color: rgba(48, 209, 88, 0.15);
    color: var(--green);
    border: 1px solid var(--green);
  }
  
  .bg-bad {
    background-color: rgba(255, 59, 48, 0.15);
    color: var(--red);
    border: 1px solid var(--red);
  }
  
  .control-box {
    width: 92%;
    max-width: 430px;
    background: #111;
    padding: 6px;
    border-radius: 6px;
    margin-bottom: 10px;
    position: relative;
    z-index: 10;
  }
  
  .slider {
    width: 100%;
    accent-color: var(--gold);
    height: 20px;
  }
  
  #permission-btn {
    display: none;
    background: var(--red);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 12px;
    width: 92%;
    max-width: 430px;
    position: relative;
    z-index: 10;
  }
  
  .directions-list-panel {
    width: 92%;
    max-width: 430px;
    background: var(--panel);
    border: 1px solid #282828;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    position: relative;
    z-index: 10;
  }
  
  .list-title {
    color: var(--gold);
    font-size: 0.8rem;
    font-weight: bold;
    margin: 0 0 10px 0;
    text-transform: uppercase;
    border-bottom: 1px solid #333;
    padding-bottom: 6px;
    text-align: center;
  }
  
  .direction-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0d0d0d;
    padding: 6px 10px;
    margin-bottom: 6px;
    border-radius: 4px;
    font-size: 0.8rem;
    border-left: 4px solid #333;
  }
  
  .direction-item.good {
    border-left-color: var(--green);
  }
  
  .direction-item.bad {
    border-left-color: var(--red);
  }
  
  .item-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  
  .item-name {
    font-weight: bold;
    color: #fff;
  }
  
  .item-cung {
    font-size: 0.7rem;
  }
  
  .btn-rotate {
    background: #2a2218;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: bold;
  }
  
  .explanation-panel {
    width: 92%;
    max-width: 430px;
    background: var(--panel);
    border: 1px solid #252525;
    border-radius: 8px;
    padding: 12px;
    position: relative;
    z-index: 10;
  }
  
  .detail-content {
    background: #080808;
    border-left: 4px solid var(--gold);
    padding: 10px;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #ffffff;
    transition: border-left-color 0.3s ease;
  }
  
  .gold-text {
    color: var(--gold);
    font-weight: bold;
  }
  
  .custom-alert-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  
  .custom-alert-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .custom-alert-box {
    background: #1a1410;
    border: 2px solid var(--gold);
    border-radius: 10px;
    width: 88%;
    max-width: 340px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(223, 183, 108, 0.2);
    transform: scale(0.8);
    transition: transform 0.3s ease;
  }
  
  .custom-alert-overlay.active .custom-alert-box {
    transform: scale(1);
  }
  
  .custom-alert-title {
    color: var(--red);
    font-size: 1rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  
  .custom-alert-msg {
    color: #f0f0f0;
    font-size: 0.85rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  
  .custom-alert-btn {
    background: linear-gradient(180deg, #ff8833, var(--orange-bright));
    color: white;
    border: none;
    padding: 8px 24px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(255, 102, 0, 0.3);
  }
  
  .btn-reset.executing {
    opacity: 0.7;
    transform: scale(0.95);
  }
  .user-input-panel {
    font-size: 12px; /* Chữ nhỏ hơn */
}
.form-group label {
    font-size: 11px;
    margin-bottom: 2px;
}
.form-group input, .form-group select {
    padding: 4px; /* Thu nhỏ các ô nhập liệu */
    height: 30px;
}
  </style>
</head>

<body>

<div class="header">
    <h1>ĐẠI THUẬT LA KINH PHONG THỦY</h1>
    <div class="header-copyright">&copy; BẢN QUYỀN HỆ THỐNG: THÁI THÔNG</div>
</div>

<div id="mainPanelWrapper" style="position: relative; border: 1px solid #333; background: #161616; padding: 15px; border-radius: 12px; margin: 10px auto; width: 90%; max-width: 500px; transition: all 0.3s ease;">
    
    <div id="toggleArrow" onclick="togglePanel()" style="position: absolute; top: 10px; right: 15px; cursor: pointer; color: #dfb76c; font-size: 12px; font-weight: bold; z-index: 100;">
        ▲
    </div>

    <div id="panelContent">
        <div class="user-input-panel">
            <div class="form-row">
                <div class="form-group" style="flex: 1.2;">
                    <label>Họ tên chủ mệnh:</label>
                    <input type="text" id="userName" value="Người Tầm Phương" onfocus="if(this.value==='Người Tầm Phương') { this.value=''; this.style.color='#fff'; }" onblur="if(this.value.trim()==='') { this.value='Người Tầm Phương'; this.style.color='#aaa'; }" oninput="recalculateFate()">
                </div>
                <div class="form-group" style="flex: 0.8;">
                    <label>Giới tính:</label>
                    <select id="gender" onchange="recalculateFate()">
                        <option value="male">Nam Mạng</option>
                        <option value="female">Nữ Mạng</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ngày tháng năm sinh (Dương lịch):</label>
                    <div class="date-input-container">
                        <input type="text" id="birthDay" placeholder="DD" maxlength="2" inputmode="numeric" oninput="handleDateInput(this, 'birthMonth')" style="text-align: center;">
                        <input type="text" id="birthMonth" placeholder="MM" maxlength="2" inputmode="numeric" oninput="handleDateInput(this, 'birthYear')" style="text-align: center;">
                        <input type="text" id="birthYear" placeholder="YYYY" maxlength="4" inputmode="numeric" oninput="handleDateInput(this, null)" style="text-align: center;">
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label>Mục đích tầm phương vị:</label>
                <select id="purpose" onchange="recalculateFate()">
                    <option value="">-- Chọn mục đích xem --</option>
                    <option value="house">Hướng Nhà, Cửa Chính</option>
                    <option value="altar">Hướng đặt Bàn Thờ</option>
                    <option value="bed">Hướng đầu Giường Ngủ</option>
                    <option value="workspace">Hướng bàn Làm việc</option>
                    <option value="kitchen">Vị trí đặt Bếp Nấu</option>
                    <option value="toilet">Vị trí Nhà vệ sinh / WC</option>
                    <option value="safe">Vị trí két sắt / Tài lộc</option>
                    <option value="gate">Hướng Cổng chính</option>
                    <option value="storage">Vị trí Kho / Tủ đồ</option>
                </select>
            </div>

            <div class="btn-action-row">
                <button class="btn-main" onclick="saveCurrentMember()">Lưu Tuổi</button>
                <button class="btn-reset" id="btnReset" onclick="clearAllData()">Làm mới</button>
            </div>
        </div>

        <div class="saved-list-panel" id="savedPanel" style="display: none; margin-top: 10px;">
            <div class="saved-container" id="savedContainer"></div>
        </div>
    </div>
</div>

<script>
    // Hàm này bắt buộc phải có để nút bấm hoạt động
    function togglePanel() {
        const content = document.getElementById('panelContent');
        const arrow = document.getElementById('toggleArrow');
        if (content.style.display === 'none') {
            content.style.display = 'block';
            arrow.innerHTML = '▲';
        } else {
            content.style.display = 'none';
            arrow.innerHTML = '▼';
        }
    }
</script>

<div class="compass-container" style="position: relative; width: 340px; height: 340px; margin: 20px auto; background: #1a1a1a; border-radius: 50%; box-shadow: 0 12px 35px rgba(0,0,0,0.5); border: 6px solid #b58e4b; overflow: hidden; color-scheme: light !important;">

  function render24SonRing() {
    // 1. Tự động sinh 360 vạch chia độ ngoài cùng
    const vachDoRing = document.getElementById('vachDoRing');
    if (vachDoRing) {
        let linesHtml = "";
        for (let i = 0; i < 360; i++) {
            let y2 = 23;
            if (i % 10 === 0) y2 = 28;
            else if (i % 5 === 0) y2 = 25;
            linesHtml += `<line x1="250" y1="18" x2="250" y2="${y2}" transform="rotate(${i}, 250, 250)" />`;
        }
        vachDoRing.innerHTML = linesHtml;
    }

    // 2. Kẻ vạch ô ngăn cung riêng biệt cho 24 Sơn Hướng (Từ bán kính 115px đến 162px)
    const khe24SonRing = document.getElementById('khe24SonRing');
    if (khe24SonRing) {
        let lines24Html = "";
        for (let i = 0; i < 24; i++) {
            // Lệch trục một góc 7.5 độ để đường kẻ đóng vai trò làm vách ngăn, kẹp tên Sơn vào tâm ô
            let gocBiên = i * 15 - 7.5;
            lines24Html += `<line x1="250" y1="115" x2="250" y2="162" transform="rotate(${gocBiên}, 250, 250)" />`;
        }
        khe24SonRing.innerHTML = lines24Html;
    }

    // 3. Khởi dựng tầng chữ 24 Sơn Hướng
    const sonRingSvg = document.getElementById('sonRingSvg');
    if (!sonRingSvg || typeof son24Data === 'undefined') return;
    sonRingSvg.innerHTML = "";

    const rSon = 136; // Nằm trung cung lọt lòng giữa r=115 và r=162
    son24Data.forEach((son, index) => {
        const trungBinhGoc = (index * 15) % 360;
        const textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textNode.setAttribute("x", "250");
        textNode.setAttribute("y", (250 - rSon).toString());
        textNode.setAttribute("text-anchor", "middle");
        textNode.setAttribute("font-family", "sans-serif");
        textNode.setAttribute("font-size", "10");
        textNode.setAttribute("font-weight", "900");
        textNode.setAttribute("transform", `rotate(${trungBinhGoc}, 250, 250)`);
        textNode.setAttribute("data-son-goc", trungBinhGoc.toString());
        textNode.textContent = son.name;

        // Định dạng sắc màu chuẩn phong thủy của anh
        if (["Cấn", "Tốn", "Khôn", "Càn"].includes(son.name)) {
            textNode.setAttribute("fill", "#ff3b30");
            textNode.setAttribute("data-color", "#ff3b30");
        } else if (["Tý", "Mão", "Ngọ", "Dậu"].includes(son.name)) {
            textNode.setAttribute("fill", "#00a525");
            textNode.setAttribute("data-color", "#00a525");
        } else {
            textNode.setAttribute("fill", "#5c4314");
            textNode.setAttribute("data-color", "#5c4314");
        }
        sonRingSvg.appendChild(textNode);
    });

    // 4. Khởi dựng bổ sung vòng 24 Sao Phúc Đức ở tầng ngoài (Bán kính r=178)
    const phucDucRingSvg = document.getElementById('phucDucRingSvg');

        "Khẩu Thiệt", "Vượng Tài", "Đăng Doanh", "Thiếu Vong", "Thiên Tặc", "Tử Mất", 
        "Vượng Tâm", "Khóc Khấp", "Cô Quả", "Vinh Phước", "Thiếu Vong", "Xương Dâm"
    ];
    if (phucDucRingSvg) {
        phucDucRingSvg.innerHTML = "";
        phucDucNames.forEach((name, index) => {
            const gocSao = (index * 15) % 360;
            const textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");
            textNode.setAttribute("x", "250");
            textNode.setAttribute("y", "72"); // Nằm ở dải tầng ngoài r=178
            textNode.setAttribute("text-anchor", "middle");
            textNode.setAttribute("font-family", "sans-serif");
            textNode.setAttribute("font-size", "6.5");

            textNode.setAttribute("data-sao-goc", gocSao.toString());
            textNode.textContent = name;
            phucDucRingSvg.appendChild(textNode);

  function tínhCungPhi(năm, tháng, ngày, giớiTính) {
    // Xử lý Lập Xuân chính xác hơn
    let namTinh = năm;
    if (tháng < 2 || (tháng === 2 && ngày < 5)) {
      namTinh = năm - 1;
    }
    let sốDư = namTinh % 9;
    if (sốDư === 0) sốDư = 9;
    let kếtQuả;
    if (giớiTính === 'male') {
      kếtQuả = (11 - sốDư) % 9;
      if (kếtQuả === 0) kếtQuả = 9;
    } else {
      kếtQuả = (sốDư + 4) % 9;
      if (kếtQuả === 0) kếtQuả = 9;
    }
    const mapCung = {
      1: 'Khảm',
      2: 'Khôn',
      3: 'Chấn',
      4: 'Tốn',
      5: 'Khôn',
      6: 'Càn',
      7: 'Đoài',
      8: 'Cấn',
      9: 'Ly'
    };
    return mapCung[kếtQuả];
  }

  function debounceRecalculate() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      recalculateFate();
    }, 300);
  }

  function validateFullDate(day, month, year) {
    if (month < 1 || month > 12) return false;
    let listDaysInMonth = [31, (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) ? 29 : 28, 31, 30, 31, 30,
      31, 31, 30, 31, 30, 31
    ];
    if (day < 1 || day > listDaysInMonth[month - 1]) return false;
    if (year < 1900 || year > 2050) {
      showCustomAlert(`Năm sinh ${year} ngoài khoảng hỗ trợ (1900-2050). Kết quả chỉ mang tính tham khảo!`);
      return true; // vẫn cho tính nhưng có cảnh báo
    }
    return true;
  }

  function recalculateFate() {
    const name = document.getElementById('userName').value || "Chủ mệnh";
    const gender = document.getElementById('gender').value;
    const dayStr = document.getElementById('birthDay').value;
    const monthStr = document.getElementById('birthMonth').value;

    if (!dayStr || !monthStr || !yearStr || yearStr.length < 4) {
      fateTxt.innerText = `${name}: Đo hướng tự do cơ bản (Chưa nhập đủ Ngày - Tháng - Năm sinh)`;

        "<div style='font-size:0.8rem;color:#8a8a8f;text-align:center;padding:10px;'>Vui lòng nhập đủ 3 ô Ngày, Tháng, Năm sinh để kích hoạt sơ đồ gợi ý Cát/Hung</div>";
      listPanelTitle.innerText = "Danh Sách Hướng Gợi Ý";
      
      const oldPanel = document.getElementById('dien-giai-bo-sung');
      if (oldPanel) oldPanel.remove();

      updateCompassUI(currentHeading);
      return;
    }

    let d = parseInt(dayStr);
    let m = parseInt(monthStr);
    let y = parseInt(yearStr);

    if (!validateFullDate(d, m, y)) {
      fateTxt.innerText = `${name}: Lỗi cấu trúc thời gian (Kiểm tra lại số ngày hoặc năm nhuận)`;
      return;
    }

    // 1. Kế thừa logic tính toán gốc
    chủMệnh = tínhCungPhi(y, m, d, gender);
    const namAm = (m < 2 || (m === 2 && d < 5)) ? y - 1 : y;
    const nguHoangInfo = getNguHoangInfo(namAm); 
    
    const hanhCungPhi = bátTrạchMap[chủMệnh].element; // Hành của người (Ví dụ: Thổ)
    const nhomMenh = bátTrạchMap[chủMệnh].group;

      `${name}: Cung ${chủMệnh} (${nhomMenh}) - Bản Mệnh Cung Phi: ${hanhCungPhi} | Năm Âm: ${namAm} | Ngũ Hoàng ${namAm}: ${nguHoangInfo}`;

    // 2. XÂY DỰNG NỘI DUNG DIỄN GIẢI ĐỘNG
    let lyGiaiCungPhi = `Bản mệnh dựa trên niên đại năm âm lịch <b>${namAm}</b> của bạn tương ứng với các trường khí vận hành của vũ trụ. Trong đo đạc thiết kế địa lý và xoay hướng <b>Bát Trạch</b>, chúng ta bắt buộc phải lấy <b>Mệnh Cung Phi</b> làm lệnh điều hành cốt lõi: Bạn thuộc phi cung <b>${chủMệnh}</b>, đại diện cho nhóm <b>${nhomMenh}</b> mang đặc tính khí của hành <b>${hanhCungPhi}</b>. Cơ thể và ngôi nhà của bạn sẽ đạt trạng thái cộng hưởng năng lượng cát lành cao nhất khi hướng về các phương vị thuộc nhóm mệnh này.`;

    let lyGiaiHungCat = "";

    const mụcĐích = document.getElementById('purpose').value;

    if (!mụcĐích || !config) {
        directionsContainer.innerHTML =

        listPanelTitle.innerText = "Danh Sách Hướng Gợi Ý";
        return;
    }

    let listDirections = [];
    directionMeta.forEach(dir => {
        const cungTrạch = bátTrạchMap[chủMệnh][dir.code];
        const isCat = cungPhầnTrăm[cungTrạch].cát;
        
        // Dùng cấu hình để quyết định: Nếu mục đích cần Cát thì hopPhongThuy = isCat, ngược lại thì = !isCat
        const hopPhongThuy = config.isCat ? isCat : !isCat;

        listDirections.push({
            ...dir, cungTrạch: cungTrạch, isCat: isCat, hopPhongThuy: hopPhongThuy
        });
    });

    listDirections.sort((a, b) => b.hopPhongThuy - a.hopPhongThuy);

    // Hiển thị tiêu đề theo cấu hình
    listPanelTitle.innerText = config.title;

    directionsContainer.innerHTML = "";

      if (advices[cungTrạch]) {
        adviceBox.style.display = 'block';
        adviceContent.innerHTML = advices[cungTrạch];
      } else {
        adviceBox.style.display = 'none';
      }
    }

    // KÍCH HOẠT HIỆU ỨNG ĐÈN LED Ở CHẾ ĐỘ CAO CẤP
    kichHoatDenLedQuet(currentHeading);
// === CẬP NHẬT KIM VÀNG (GHOST NEEDLE) ===
if (targetAngle !== null) {
    const ghost = document.getElementById('ghostNeedle');
    if (ghost) {
        ghost.style.opacity = "1";
        ghost.style.transform = `translate(-50%, -50%) rotate(${targetAngle - currentHeading}deg)`;
    }
}
}

// Tách logic đèn LED quét thành hàm riêng biệt để chạy mượt mà, tái sử dụng tốt
function kichHoatDenLedQuet(heading) {
    // Đoạn sửa đổi cốt lõi: Sử dụng trực tiếp góc heading truyền vào để tính góc đích chính xác
    let ledTargetAngle = (heading % 360 + 360) % 360;

    // 1. Làm sáng chữ 8 Hướng Lớn
    const huongLonTexts = document.querySelectorAll("#chuHuongLonG text");
    huongLonTexts.forEach(txt => {
        let textGoc = parseFloat(txt.getAttribute("data-goc"));
        let phanSai = Math.abs(ledTargetAngle - textGoc);
        if (phanSai > 180) phanSai = 360 - phanSai;

        if (phanSai <= 22.5) { 
            txt.style.opacity = "1";
            txt.style.fontWeight = "900";
            if (txt.getAttribute("fill") === "#00a525") txt.style.fill = "#00ff37";
            else if (txt.getAttribute("fill") === "#ff3b30") txt.style.fill = "#ff1a00";
        } else {
            txt.style.opacity = "0.5"; 
            if (txt.parentNode.getAttribute("id") === "textChinhPhuong") {
                txt.style.fill = txt.getAttribute("transform") ? (txt.getAttribute("transform").includes("rotate(90") || txt.getAttribute("transform").includes("rotate(270") ? "#00a525" : "#ff3b30") : "#ff3b30";
            } else {
                txt.style.fill = "#6b4e18";
            }
        }
    });

    // 2. Làm sáng và phóng to chữ 24 Sơn Hướng (Khi kim nằm lọt lòng cung ô 15 độ)
    const sonTexts = document.querySelectorAll("#sonRingSvg text");
    sonTexts.forEach(txt => {
        let sonGoc = parseFloat(txt.getAttribute("data-son-goc"));
        let phanSai = Math.abs(ledTargetAngle - sonGoc);
        if (phanSai > 180) phanSai = 360 - phanSai;

        if (phanSai <= 7.5) { 
            txt.style.opacity = "1";
            txt.style.fontSize = "13px"; 
            let origColor = txt.getAttribute("data-color");
            if (origColor === "#5c4314") {
                txt.style.fill = "#ffcc00"; 
            } else if (origColor === "#ff3b30") {
                txt.style.fill = "#ff0000";
            } else {
                txt.style.fill = "#00ff00";
            }
        } else {
            txt.style.opacity = "0.5";
            txt.style.fontSize = "10px";
            txt.style.fill = txt.getAttribute("data-color");
        }
    });

    // 3. Làm sáng tên Sao tại vòng Phúc Đức ngoài cùng
    const saoTexts = document.querySelectorAll("#phucDucRingSvg text");
    saoTexts.forEach(txt => {
        let saoGoc = parseFloat(txt.getAttribute("data-sao-goc"));
        let phanSai = Math.abs(ledTargetAngle - saoGoc);
        if (phanSai > 180) phanSai = 360 - phanSai;

        if (phanSai <= 7.5) {
            txt.style.fill = "#ff4500"; 
            txt.style.opacity = "1";
            txt.style.fontSize = "8px";
        } else {
            txt.style.fill = "#7a623c";
            txt.style.opacity = "0.4";
            txt.style.fontSize = "6.5px";
        }
    });
}

// THUẬT TOÁN KIM QUAY LA BÀN - TỐI ƯU TOÀN DIỆN (FINAL)
// ==========================================================================
let lastHeading = null;
let orientationListenerAdded = false;   // ← Flag quan trọng chống trùng listener

const SMOOTH_MIN = 0.07;   // Tăng nhẹ để nhạy hơn
const SMOOTH_MAX = 0.52;   // Tăng để bám tay tốt hơn khi xoay nhanh

// ====================== HANDLE ORIENTATION ======================
function handleOrientation(event) {
    let heading = null;

    if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        heading = event.webkitCompassHeading;           // iOS
    } 
    else if (event.alpha !== undefined && event.alpha !== null) {
        heading = (360 - event.alpha) % 360;            // Android
    }

    if (heading === null) return;

    // Khóa khi đang kéo slider thủ công
    if (document.activeElement === document.getElementById('compassSlider')) return;

    // Khởi tạo lần đầu + đánh thức phong thủy
    if (lastHeading === null) {
        lastHeading = heading;
        updateCompassUI(lastHeading);
        if (typeof recalculateFate === 'function') recalculateFate();
        return;
    }

    let diff = heading - lastHeading;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;

    const absDiff = Math.abs(diff);
    let dynamicFactor = SMOOTH_MIN;

    if (absDiff > 8) {
        dynamicFactor = SMOOTH_MAX;
    } else if (absDiff > 1) {
        dynamicFactor = SMOOTH_MIN + (absDiff / 8) * (SMOOTH_MAX - SMOOTH_MIN);
    }

    heading = lastHeading + diff * dynamicFactor;
    lastHeading = (heading % 360 + 360) % 360;

    updateCompassUI(lastHeading);
}

  // Hàm đồng bộ khi gạt thanh kéo tay
  function manualRotate(value) {
    let numValue = parseFloat(value);
    lastHeading = numValue;
    updateCompassUI(numValue);
  }

  function saveCurrentMember() {
    const name = document.getElementById('userName').value.trim();
    const gender = document.getElementById('gender').value;
    const dayStr = document.getElementById('birthDay').value;
    const monthStr = document.getElementById('birthMonth').value;
    const yearStr = document.getElementById('birthYear').value;
    if (!name || name === "Người Tầm Phương") {
      showCustomAlert("Vui lòng nhập họ tên thật của thành viên gia đình!");
      return;
    }
    if (!dayStr || !monthStr || !yearStr) {
      showCustomAlert("Vui lòng điền hoàn chỉnh Ngày, Tháng, Năm sinh trước khi lưu!");
      return;
    }
    let data = JSON.parse(localStorage.getItem('fengshui_members')) || [];
    data = data.filter(m => m.name !== name);
    data.push({
      name, gender, birthDay: dayStr, birthMonth: monthStr, birthYear: yearStr
    });
    localStorage.setItem('fengshui_members', JSON.stringify(data));
    loadSavedMembers();
  }

  function loadSavedMembers() {
    const data = JSON.parse(localStorage.getItem('fengshui_members')) || [];
    if (data.length === 0) {
      savedPanel.style.display = "none";
      return;
    }
    savedPanel.style.display = "block";
    savedContainer.innerHTML = "";
    data.forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'saved-chip';
      chip.innerHTML =
        `
                    <span onclick="selectMember('${m.name}', '${m.gender}', '${m.birthDay}', '${m.birthMonth}', '${m.birthYear}')">👤 ${m.name}</span>
                    <span class="del-btn" onclick="deleteMember(event, '${m.name}')">×</span>
                `;
      savedContainer.appendChild(chip);
    });
  }

  function selectMember(name, gender, birthDay, birthMonth, birthYear) {
    document.getElementById('userName').value = name;
    document.getElementById('userName').style.color = '#fff';
    document.getElementById('gender').value = gender;
    document.getElementById('birthDay').value = birthDay;
    document.getElementById('birthMonth').value = birthMonth;
    document.getElementById('birthYear').value = birthYear;
    recalculateFate();
  }

  function deleteMember(event, name) {
    event.stopPropagation();
    let data = JSON.parse(localStorage.getItem('fengshui_members')) || [];
    data = data.filter(m => m.name !== name);
    localStorage.setItem('fengshui_members', JSON.stringify(data));
    loadSavedMembers();
  }

    }
    // Hàm mới: Trả về chi tiết Thần Sát của Sơn và phương án Hóa Giải dựa theo Cung Phi của chủ nhà
function layThongTin24Son(doSo, cungPhi, namHienTai) {
    // 1. Dữ liệu cấu hình 24 Sơn (Giữ nguyên mảng của bạn)
    const data24Son = [
        { son: "Nhâm", min: 337.5, max: 352.5, huong: "Bắc" },
        { son: "Tý", min: 352.5, max: 7.5, huong: "Bắc" },
        { son: "Quý", min: 7.5, max: 22.5, huong: "Bắc" },
        { son: "Sửu", min: 22.5, max: 37.5, huong: "Đông Bắc" },
        { son: "Cấn", min: 37.5, max: 52.5, huong: "Đông Bắc" },
        { son: "Dần", min: 52.5, max: 67.5, huong: "Đông Bắc" },
        { son: "Giáp", min: 67.5, max: 82.5, huong: "Đông" },
        { son: "Mão", min: 82.5, max: 97.5, huong: "Đông" },
        { son: "Ất", min: 97.5, max: 112.5, huong: "Đông" },
        { son: "Thìn", min: 112.5, max: 127.5, huong: "Đông Nam" },
        { son: "Tốn", min: 127.5, max: 142.5, huong: "Đông Nam" },
        { son: "Tỵ", min: 142.5, max: 157.5, huong: "Đông Nam" },
        { son: "Bính", min: 157.5, max: 172.5, huong: "Nam" },
        { son: "Ngọ", min: 172.5, max: 187.5, huong: "Nam" },
        { son: "Đinh", min: 187.5, max: 202.5, huong: "Nam" },
        { son: "Mùi", min: 202.5, max: 217.5, huong: "Tây Nam" },
        { son: "Khôn", min: 217.5, max: 232.5, huong: "Tây Nam" },
        { son: "Thân", min: 232.5, max: 247.5, huong: "Tây Nam" },
        { son: "Canh", min: 247.5, max: 262.5, huong: "Tây" },
        { son: "Dậu", min: 262.5, max: 277.5, huong: "Tây" },
        { son: "Tân", min: 277.5, max: 292.5, huong: "Tây" },
        { son: "Tuất", min: 292.5, max: 307.5, huong: "Tây Bắc" },
        { son: "Càn", min: 307.5, max: 322.5, huong: "Tây Bắc" },
        { son: "Hợi", min: 322.5, max: 337.5, huong: "Tây Bắc" }
    ];

    // 2. Tìm sơn hiện tại
    let gockim = (doSo % 360 + 360) % 360;
    let sonHienTai = data24Son.find(s => (s.min > s.max) ? (gockim >= s.min || gockim < s.max) : (gockim >= s.min && gockim < s.max)) || data24Son[1];

    // 3. Logic xác định Cát/Hung tự động (Không cần if cho từng cung mệnh)
    const tayTuCung = ["Càn", "Khôn", "Cấn", "Đoài"];
    const tayTuHuong = ["Tây Bắc", "Tây", "Tây Nam", "Đông Bắc"];
    
    const isGiaChuTayTu = tayTuCung.includes(cungPhi);
    const isHuongTayTu = tayTuHuong.includes(sonHienTai.huong);
    
    // Nếu cùng thuộc Tây Tứ hoặc cùng thuộc Đông Tứ là Cát
    const isCat = (isGiaChuTayTu === isHuongTayTu);

    let luanDoan = isCat 
        ? `Sơn ${sonHienTai.son} (${sonHienTai.huong}) - Thuộc cung vị Cát Tường của người mệnh ${cungPhi}.`
        : `Sơn ${sonHienTai.son} (${sonHienTai.huong}) - Phạm hướng Hung phương so với cung mệnh ${cungPhi}.`;
    
    let hoaGiai = isCat 
        ? "Hướng tốt, khí trường ổn định, phù hợp với bản mệnh."
        : "Mẹo hóa giải: Sử dụng gương bát quái hoặc vật phẩm phong thủy hành Kim/Thủy tùy theo ngũ hành của hướng để điều hòa.";

    // 4. Ghi đè các trường hợp đặc biệt (Sơn Càn, Tuất, Hợi của mệnh Cấn)
    if (cungPhi === "Cấn") {
        if (sonHienTai.son === "Càn") {
            luanDoan = "Sơn Càn (Tây Bắc) - Đạt vị Thiên Y vô cùng cát lợi, gia đạo hưng vượng.";
            hoaGiai = "Hướng đại cát, không cần hóa giải.";
        } else if (sonHienTai.son === "Tuất") {
            luanDoan = "Sơn Tuất (Tây Bắc) - Phạm thế Cô Quả, Tố Tụng, dễ vướng thị phi.";
            hoaGiai = "Mẹo hóa giải: Đặt cặp Tỳ Hưu đá hoặc chuỗi xu Ngũ Đế tại ngạch cửa.";
        } else if (sonHienTai.son === "Hợi") {
            luanDoan = "Sơn Hợi (Tây Bắc) - Phạm trục kiếp tài, tiền bạc dễ hao hụt.";
            hoaGiai = "Mẹo hóa giải: Đặt chậu cây xanh hoặc dùng thảm xanh lá để giữ tụ khí.";
        }
    }

    return { son: sonHienTai.son, huong: sonHienTai.huong, luanDoan, hoaGiai };
}
function tinhHanCuuTinhTheoNam(huong, namHienTai) {
    const nam = namHienTai || new Date().getFullYear();
    
    // --- 1. TÍNH VỊ TRÍ NGŨ HOÀNG (Dựa trên chu kỳ 9 năm) ---
    // Thứ tự Cửu Tinh: 5-4-3-2-1-9-8-7-6 (Trung, Càn, Đoài, Cấn, Ly, Khảm, Khôn, Chấn, Tốn)
    const cacHuong = ["Trung Cung", "Tây Bắc", "Tây", "Đông Bắc", "Nam", "Bắc", "Tây Nam", "Đông", "Đông Nam"];
    const indexNguHoang = (5 - ((nam - 2024) % 9) + 9) % 9;
    const viTriNguHoang = cacHuong[indexNguHoang];

    // --- 2. TÍNH VỊ TRÍ TAM SÁT (Đối xung với Thái Tuế) ---
    // Quy luật: Dần Ngọ Tuất - Sát ở Bắc; Thân Tý Thìn - Sát ở Nam; Tỵ Dậu Sửu - Sát ở Đông; Hợi Mão Mùi - Sát ở Tây
    const diaChi = nam % 12; // 0: Thân, 1: Dậu, 2: Tuất, 3: Hợi, 4: Tý, 5: Sửu, 6: Dần, 7: Mão, 8: Thìn, 9: Tỵ, 10: Ngọ, 11: Mùi
    let viTriTamSat = "";
    if ([6, 7, 8].includes(diaChi)) viTriTamSat = "Bắc";
    else if ([9, 10, 11].includes(diaChi)) viTriTamSat = "Đông";
    else if ([0, 1, 2].includes(diaChi)) viTriTamSat = "Nam";
    else viTriTamSat = "Tây";

    // --- 3. XỬ LÝ KẾT QUẢ (Logic tự động) ---
    let thongTinSao = `✅ Vận hạn năm ${nam}: Hướng ${huong} khí trường bình hòa, không bị đại hung tinh xung chiếu.`;
    let meoGiaiHan = "Gia đạo an lành, không cần bài trí vật phẩm hóa giải.";

    if (huong === viTriNguHoang) {
        thongTinSao = `⚠️ CẢNH BÁO NĂM ${nam}: Hướng ${huong} bị [Ngũ Hoàng Đại Sát] chiếm đóng. Cực kỳ kỵ động thổ, sửa chữa, dễ sinh tai họa.`;
        meoGiaiHan = "👉 Hóa giải: Treo chuông gió đồng 6 thanh hoặc đặt Tháp Văn Xương kim loại tại phương vị này để tiết khí Thổ.";
    } else if (huong === viTriTamSat) {
        thongTinSao = `⚠️ CẢNH BÁO NĂM ${nam}: Phương vị ${huong} phạm vào hạn [Tam Sát].`;
        meoGiaiHan = "👉 Hóa giải: Tránh động thổ sâu. Đặt cặp Kỳ Lân đồng quay đầu nhìn ra ngoài để chặn sát khí.";
    }

    return { thongTinSao, meoGiaiHan };
}

// ====================== REQUEST PERMISSION ======================
function requestPermission() {
    const permBtn = document.getElementById('permission-btn');
    const isIOS = typeof DeviceOrientationEvent !== 'undefined' && 
                  typeof DeviceOrientationEvent.requestPermission === 'function';

    if (isIOS) {
        DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
                if (permissionState === 'granted') {
                    localStorage.setItem('ios_compass_granted', 'true');
                    addOrientationListener();
                    if (permBtn) permBtn.style.display = 'none';
                } else {
                    showCustomAlert("Quyền truy cập cảm biến bị từ chối. Bạn vẫn có thể xoay la bàn thủ công.");
                }
            })
            .catch(console.error);
    } else {
        // Android
        addOrientationListener();
        if (permBtn) permBtn.style.display = 'none';
        showCustomAlert("Cảm biến hướng địa từ đã được kích hoạt thành công!");
    }
}

// ====================== THÊM LISTENER (TRÁNH TRÙNG) ======================
function addOrientationListener() {
    if (orientationListenerAdded) return;

    const isAndroid = navigator.userAgent.toLowerCase().indexOf("android") > -1;
    const eventName = (isAndroid && 'ondeviceorientationabsolute' in window) 
        ? 'deviceorientationabsolute' 
        : 'deviceorientation';

    window.removeEventListener(eventName, handleOrientation, true);
    window.addEventListener(eventName, handleOrientation, true);

    orientationListenerAdded = true;
}

// ====================== WINDOW ONLOAD ======================
window.onload = function() {
    if (typeof render24SonRing === 'function') render24SonRing();
    if (typeof loadSavedMembers === 'function') loadSavedMembers();
    if (typeof recalculateFate === 'function') recalculateFate();

    const permBtn = document.getElementById('permission-btn');
    const isIOS = typeof DeviceOrientationEvent !== 'undefined' && 
                  typeof DeviceOrientationEvent.requestPermission === 'function';

    if (isIOS) {
        if (localStorage.getItem('ios_compass_granted') === 'true') {
            // Đã cấp quyền trước → chỉ cần chạm 1 lần để kích hoạt
            if (permBtn) {
                permBtn.style.display = 'block';
                permBtn.style.background = 'rgba(223, 183, 108, 0.2)';
                permBtn.style.color = '#dfb76c';
                permBtn.style.border = '1px solid #dfb76c';
                permBtn.innerText = "CHẠM ĐỂ KÍCH HOẠT LA BÀN (iOS)";
                
                // Chỉ cần chạm là kích hoạt
                permBtn.onclick = function() {
                    addOrientationListener();
                    permBtn.style.display = 'none';
                };
            }
        } else {
            if (permBtn) permBtn.style.display = 'block';
        }
    } else {
        // Android: Tự động kích hoạt
        addOrientationListener();
        if (permBtn) permBtn.style.display = 'none';
    }
};
