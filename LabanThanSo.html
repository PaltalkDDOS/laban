<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng...</title>

  <!-- Cách 1: Chuyển hướng tức thì bằng Meta tag (Hỗ trợ mọi trình duyệt) -->
  <meta http-equiv="refresh" content="0; url=index.html">

  <!-- Cách 2: Chuyển hướng bằng JavaScript (Tốc độ cao và tối ưu lịch sử duyệt web) -->
  <script>
    window.location.replace("index.html");
  </script>
</head>
<body style="background: #161616; color: #dfb76c; font-family: Arial, sans-serif; text-align: center; padding-top: 20vh; margin: 0;">

  <div style="font-size: 40px; margin-bottom: 20px;">🚀</div>
  <h2 style="margin: 0 0 10px 0;">Đang chuyển hướng sang phiên bản mới...</h2>
  <p style="color: #888; font-size: 0.9rem;">Hệ thống đang tự động đưa bạn đến ứng dụng.</p>
  
  <!-- Dự phòng nếu trình duyệt của user chặn chuyển hướng tự động -->
  <p style="margin-top: 30px; font-size: 0.85rem;">
    Nếu đợi lâu không thấy chuyển, <a href="index.html" style="color: #dfb76c; text-decoration: underline; font-weight: bold;">Bấm vào đây để vào ngay</a>.
  </p>

</body>
</html>
