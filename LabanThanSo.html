<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đại Thuật La Kinh Phong Thủy Tối Thượng - Pro</title>
    <style>
        :root {
            --gold: #dfb76c;
            --dark: #070707;
            --panel: #141414;
            --panel-light: #1e1912;
            --text: #e0e0e0;
            --red: #ff3b30;
            --green: #30d158;
            --blue: #0a84ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            background: linear-gradient(180deg, #1f1a10 0%, var(--dark) 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .header h1 {
            color: var(--gold);
            font-size: 1.1rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* KHU VỰC QUẢN LÝ THÀNH VIÊN (LOCALSTORAGE) */
        .user-panel {
            width: 92%;
            max-width: 450px;
            background: var(--panel-light);
            border: 1px solid #443322;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .member-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .member-selector select {
            flex: 1;
            background: #2a2218;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .btn {
            background: linear-gradient(180deg, #c5a059 0%, #a47e3a 100%);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #554433;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 3px;
        }

        .form-group input, .form-group select {
            background: #111;
            border: 1px solid #554433;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        /* KHUNG LA BÀN 24 SƠN HƯỚNG CHUYÊN NGHIỆP */
        .compass-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cross-line-v {
            position: absolute;
            width: 1.5px;
            height: 100%;
            background: var(--red);
            z-index: 4;
            pointer-events: none;
        }

        .cross-line-h {
            position: absolute;
            width: 100%;
            height: 1.5px;
            background: var(--red);
            z-index: 4;
            pointer-events: none;
        }

        .compass-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px double var(--gold);
            border-radius: 50%;
            background: radial-gradient(circle, #181818 0%, #050505 60%, #111 100%);
            box-shadow: 0 0 25px rgba(223, 183, 108, 0.2);
            transform: rotate(0deg);
            will-change: transform;
            z-index: 1;
        }

        .center-needle {
            position: absolute;
            width: 10px;
            height: 92%;
            background: linear-gradient(to bottom, var(--red) 50%, #555 50%);
            clip-path: polygon(50% 0%, 100% 12%, 60% 12%, 60% 88%, 100% 88%, 50% 100%, 0% 88%, 40% 88%, 40% 12%, 0% 12%);
            z-index: 3;
            pointer-events: none;
        }

        .center-pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--gold);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* 8 HƯỚNG CHÍNH (VÒNG TRONG) */
        .direction-label {
            position: absolute;
            font-weight: bold;
            font-size: 0.7rem;
            text-align: center;
            width: 50px;
            transform-origin: center center;
        }

        /* 24 SƠN HƯỚNG (VÒNG NGOÀI) */
        .son-label {
            position: absolute;
            font-size: 0.58rem;
            font-weight: 600;
            text-align: center;
            width: 30px;
            color: #aaa;
            transform-origin: center 165px; /* Tâm xoay nửa bán kính */
            top: 5px;
            left: 155px;
        }

        /* PANEL KẾT QUẢ VÀ ĐÁNH GIÁ */
        .status-panel {
            width: 92%;
            max-width: 450px;
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        .degree-display {
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .fate-display {
            font-size: 0.85rem;
            color: #fff;
            background: #1a1a1a;
            padding: 6px;
            margin: 6px 0;
            border-radius: 4px;
            border-left: 4px solid var(--gold);
            display: flex;
            justify-content: space-around;
        }

        .judgment-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 3px;
            text-transform: uppercase;
        }
        .bg-good { background-color: rgba(48, 209, 88, 0.15); color: var(--green); border: 1px solid var(--green); }
        .bg-bad { background-color: rgba(255, 59, 48, 0.15); color: var(--red); border: 1px solid var(--red); }

        .control-box {
            width: 92%;
            max-width: 450px;
            background: #111;
            border: 1px solid #222;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .slider { width: 100%; accent-color: var(--gold); }

        #permission-btn {
            display: none;
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            width: 92%;
            max-width: 450px;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.3);
        }

        .explanation-panel {
            width: 92%;
            max-width: 450px;
            background: var(--panel);
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .panel-title {
            color: var(--gold);
            font-size: 0.85rem;
            margin: 0 0 8px 0;
            border-bottom: 1px solid #252525;
            padding-bottom: 4px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-content {
            background: #080808;
            border-left: 3px solid var(--gold);
            padding: 10px;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .warn-text { color: var(--red); font-weight: bold; }
        .good-text { color: var(--green); font-weight: bold; }
        .element-badge { padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 0.75rem; color: #fff;}
        
        /* Màu phong thủy ngũ hành */
        .el-kim { background-color: #b0b0b0; color: #000; }
        .el-moc { background-color: #2e7d32; }
        .el-thuy { background-color: #1565c0; }
        .el-hoa { background-color: #c62828; }
        .el-tho { background-color: #6d4c41; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ĐẠI THUẬT LA KINH PHONG THỦY - BẢN CAO CẤP</h1>
    </div>

    <div class="user-panel">
        <div class="member-selector">
            <select id="memberList" onchange="loadMember()"></select>
            <button class="btn" onclick="saveMember()">Lưu Tuổi</button>
            <button class="btn btn-danger" onclick="deleteMember()">Xóa</button>
        </div>
        
        <div class="form-grid">
            <div class="form-group">
                <label>Tên thành viên:</label>
                <input type="text" id="memberName" value="Mệnh Chủ Gốc">
            </div>
            <div class="form-group">
                <label>Năm sinh (Dương lịch):</label>
                <input type="number" id="birthYear" value="1990" min="1930" max="2026" onchange="recalculateFate()">
            </div>
            <div class="form-group">
                <label>Giới tính phối mệnh:</label>
                <select id="gender" onchange="recalculateFate()">
                    <option value="male">Nam Mạng</option>
                    <option value="female">Nữ Mạng</option>
                </select>
            </div>
            <div class="form-group">
                <label>Khảo sát Dương trạch:</label>
                <select id="purpose" onchange="recalculateFate()">
                    <option value="house">Hướng Cửa Chính / Bàn Thờ</option>
                    <option value="bed">Hướng Đầu Giường Ngủ</option>
                    <option value="desk">Hướng Bàn Làm Việc</option>
                    <option value="kitchen">Vị Trí Đặt Bếp (Tọa Hung)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="compass-container">
        <div class="cross-line-v"></div>
        <div class="cross-line-h"></div>
        <div class="center-pin"></div>
        <div class="center-needle" id="needle"></div>
        
        <div class="compass-dial" id="compass">
            <div class="direction-label" style="color:var(--red); top:30px; left:145px;">BẮC<br>KHẢM</div> 
            <div class="direction-label" style="color:var(--gold); top:65px; right:65px; transform:rotate(45deg);">Đ.BẮC<br>CẤN</div> 
            <div class="direction-label" style="color:var(--gold); right:25px; top:155px; transform:rotate(90deg);">ĐÔNG<br>CHẤN</div> 
            <div class="direction-label" style="color:var(--gold); bottom:65px; right:65px; transform:rotate(135deg);">Đ.NAM<br>TỐN</div> 
            <div class="direction-label" style="color:var(--gold); bottom:30px; left:145px; transform:rotate(180deg);">NAM<br>LY</div> 
            <div class="direction-label" style="color:var(--gold); bottom:65px; left:65px; transform:rotate(225deg);">T.NAM<br>KHÔN</div> 
            <div class="direction-label" style="color:var(--gold); left:25px; top:155px; transform:rotate(270deg);">TÂY<br>ĐOÀI</div> 
            <div class="direction-label" style="color:var(--gold); top:65px; left:65px; transform:rotate(315deg);">T.BẮC<br>CÀN</div>
            
            <div id="son-circle"></div>
        </div>
    </div>

    <button id="permission-btn" onclick="requestPermission()">KÍCH HOẠT SENSOR ĐIỆN THOẠI</button>

    <div class="status-panel">
        <div class="degree-display" id="degree-txt">0° - Phương BẮC - Sơn TÝ</div>
        <div class="fate-display">
            <span id="fate-txt">Mệnh: Khảm Thủy</span>
            <span id="element-txt" class="element-badge el-thuy">Hành Thủy</span>
        </div>
        <div id="judgment-box" class="judgment-badge bg-good">HƯỚNG TỐT: SINH KHÍ</div>
    </div>

    <div class="control-box">
        <input type="range" min="0" max="360" value="0" class="slider" id="compassSlider" oninput="manualRotate(this.value)">
    </div>

    <div class="explanation-panel">
        <p class="panel-title">Luận Giải Mật Pháp Phương Vị</p>
        <div class="detail-content" id="detail-box">
            Đang tính toán thiên can địa chi...
        </div>
    </div>

    <script>
        const compass = document.getElementById('compass');
        const needle = document.getElementById('needle');
        const degreeTxt = document.getElementById('degree-txt');
        const fateTxt = document.getElementById('fate-txt');
        const elementTxt = document.getElementById('element-txt');
        const judgmentBox = document.getElementById('judgment-box');
        const detailBox = document.getElementById('detail-box');
        const compassSlider = document.getElementById('compassSlider');
        const permBtn = document.getElementById('permission-btn');
        const sonCircle = document.getElementById('son-circle');

        // Định nghĩa 24 Sơn Hướng chính xác theo góc độ La Kinh
        const sonHuong24 = [
            { name: "Nhâm", min: 337.5, max: 352.5, element: "Thủy", class: "el-thuy" },
            { name: "Tý", min: 352.5, max: 7.5, element: "Thủy", class: "el-thuy" },
            { name: "Quý", min: 7.5, max: 22.5, element: "Thủy", class: "el-thuy" },
            { name: "Sửu", min: 22.5, max: 37.5, element: "Thổ", class: "el-tho" },
            { name: "Cấn", min: 37.5, max: 52.5, element: "Thổ", class: "el-tho" },
            { name: "Dần", min: 52.5, max: 67.5, element: "Mộc", class: "el-moc" },
            { name: "Giáp", min: 67.5, max: 82.5, element: "Mộc", class: "el-moc" },
            { name: "Mão", min: 82.5, max: 97.5, element: "Mộc", class: "el-moc" },
            { name: "Ất", min: 97.5, max: 112.5, element: "Mộc", class: "el-moc" },
            { name: "Thìn", min: 112.5, max: 127.5, element: "Thổ", class: "el-tho" },
            { name: "Tốn", min: 127.5, max: 142.5, element: "Mộc", class: "el-moc" },
            { name: "Tỵ", min: 142.5, max: 157.5, element: "Hỏa", class: "el-hoa" },
            { name: "Bính", min: 157.5, max: 172.5, element: "Hỏa", class: "el-hoa" },
            { name: "Ngọ", min: 172.5, max: 187.5, element: "Hỏa", class: "el-hoa" },
            { name: "Đinh", min: 187.5, max: 202.5, element: "Hỏa", class: "el-hoa" },
            { name: "Mùi", min: 202.5, max: 217.5, element: "Thổ", class: "el-tho" },
            { name: "Khôn", min: 217.5, max: 232.5, element: "Thổ", class: "el-tho" },
            { name: "Thân", min: 232.5, max: 247.5, element: "Kim", class: "el-kim" },
            { name: "Canh", min: 247.5, max: 262.5, element: "Kim", class: "el-kim" },
            { name: "Dậu", min: 262.5, max: 277.5, element: "Kim", class: "el-kim" },
            { name: "Tân", min: 277.5, max: 292.5, element: "Kim", class: "el-kim" },
            { name: "Tuất", min: 292.5, max: 307.5, element: "Thổ", class: "el-tho" },
            { name: "Càn", min: 307.5, max: 322.5, element: "Kim", class: "el-kim" },
            { name: "Hợi", min: 322.5, max: 337.5, element: "Thủy", class: "el-thuy" }
        ];

        const bátTrạchMap = {
            'Khảm': { 'N': 'Phục Vị', 'NE': 'Ngũ Quỷ', 'E': 'Thiên Y', 'SE': 'Sinh Khí', 'S': 'Diên Niên', 'SW': 'Tuyệt Mệnh', 'W': 'Họa Hại', 'NW': 'Lục Sát', 'group': 'Đông Tứ Mệnh', 'el': 'Thủy', 'class': 'el-thuy' },
            'Ly':   { 'N': 'Diên Niên', 'NE': 'Họa Hại', 'E': 'Sinh Khí', 'SE': 'Thiên Y', 'S': 'Phục Vị', 'SW': 'Lục Sát', 'W': 'Ngũ Quỷ', 'NW': 'Tuyệt Mệnh', 'group': 'Đông Tứ Mệnh', 'el': 'Hỏa', 'class': 'el-hoa' },
            'Chấn': { 'N': 'Thiên Y', 'NE': 'Lục Sát', 'E': 'Phục Vị', 'SE': 'Diên Niên', 'S': 'Sinh Khí', 'SW': 'Họa Hại', 'W': 'Tuyệt Mệnh', 'NW': 'Ngũ Quỷ', 'group': 'Đông Tứ Mệnh', 'el': 'Mộc', 'class': 'el-moc' },
            'Tốn':  { 'N': 'Sinh Khí', 'NE': 'Tuyệt Mệnh', 'E': 'Diên Niên', 'SE': 'Phục Vị', 'S': 'Thiên Y', 'SW': 'Ngũ Quỷ', 'W': 'Lục Sát', 'NW': 'Họa Hại', 'group': 'Đông Tứ Mệnh', 'el': 'Mộc', 'class': 'el-moc' },
            'Càn':  { 'N': 'Lục Sát', 'NE': 'Thiên Y', 'E': 'Ngũ Quỷ', 'SE': 'Họa Hại', 'S': 'Tuyệt Mệnh', 'SW': 'Diên Niên', 'W': 'Sinh Khí', 'NW': 'Phục Vị', 'group': 'Tây Tứ Mệnh', 'el': 'Kim', 'class': 'el-kim' },
            'Khôn': { 'N': 'Tuyệt Mệnh', 'NE': 'Sinh Khí', 'E': 'Họa Hại', 'SE': 'Ngũ Quỷ', 'S': 'Lục Sát', 'SW': 'Phục Vị', 'W': 'Thiên Y', 'NW': 'Diên Niên', 'group': 'Tây Tứ Mệnh', 'el': 'Thổ', 'class': 'el-tho' },
            'Đoài': { 'N': 'Họa Hại', 'NE': 'Diên Niên', 'E': 'Tuyệt Mệnh', 'SE': 'Lục Sát', 'S': 'Ngũ Quỷ', 'SW': 'Thiên Y', 'W': 'Phục Vị', 'NW': 'Sinh Khí', 'group': 'Tây Tứ Mệnh', 'el': 'Kim', 'class': 'el-kim' },
            'Cấn':  { 'N': 'Ngũ Quỷ', 'NE': 'Phục Vị', 'E': 'Lục Sát', 'SE': 'Họa Hại', 'S': 'Tuyệt Mệnh', 'SW': 'Sinh Khí', 'W': 'Diên Niên', 'NW': 'Thiên Y', 'group': 'Tây Tứ Mệnh', 'el': 'Thổ', 'class': 'el-tho' }
        };

        const cungYNghea = {
            'Sinh Khí': { cát: true, ý: 'Cung Đại Cát, sinh khí dồi dào, thăng quan tiến chức, vượng tài lộc.' },
            'Thiên Y': { cát: true, ý: 'Cung Trung Cát, chủ sức khỏe trường thọ, tiêu trừ bệnh tật, có quý nhân độ trì.' },
            'Diên Niên': { cát: true, ý: 'Cung Cát, củng cố tình cảm gia đình, ngoại giao tốt, vượng nhân đinh.' },
            'Phục Vị': { cát: true, ý: 'Cung Tiểu Cát, bình an, vững vàng, có lợi cho tinh thần và học hành thi cử.' },
            'Tuyệt Mệnh': { cát: false, ý: 'Cung Đại Hung, cực xấu. Chủ tổn thọ, tai nạn, bệnh tật hiểm nghèo, sản nghiệp tiêu tán.' },
            'Ngũ Quỷ': { cát: false, ý: 'Cung Hung, dễ gặp tiếng ác, hỏa hoạn, mất trộm, gia đạo bất an, tiểu nhân quấy phá.' },
            'Lục Sát': { cát: false, ý: 'Cung Hung, chủ tranh chấp kiện tụng, tai tiếng thị phi, gia đạo bất hòa.' },
            'Họa Hại': { cát: false, ý: 'Cung Tiểu Hung, dễ gặp trắc trở, kiện tụng nhỏ, tinh thần mệt mỏi vì việc vặt.' }
        };

        let chủMệnh = 'Khảm'; 
        let currentCode = 'N';
        let currentHeading = 0;

        // Tự động vẽ 24 Sơn Hướng lên La bàn vật lý theo đúng vị trí hình học
        function render24Son() {
            sonCircle.innerHTML = '';
            sonHuong24.forEach((son, index) => {
                const angle = (index * 15 + 180) % 360; // Đồng bộ chuẩn tâm Bắc gốc của chị
                const div = document.createElement('div');
                div.className = 'son-label';
                div.style.transform = `rotate(${angle}deg)`;
                div.innerHTML = `${son.name}<br>·`;
                sonCircle.appendChild(div);
            });
        }

        function tínhCungPhi(năm, giớiTính) {
            let sốDư = năm % 9;
            if (sốDư === 0) sốDư = 9;
            if (giớiTính === 'male') {
                let kếtQuả = (11 - sốDư) % 9;
                if (kếtQuả === 0) kếtQuả = 9;
                return {1:'Khảm', 2:'Khôn', 3:'Chấn', 4:'Tốn', 5:'Khôn', 6:'Càn', 7:'Đoài', 8:'Cấn', 9:'Ly'}[kếtQuả];
            } else {
                let kếtQuả = (sốDư + 4) % 9;
                if (kếtQuả === 0) kếtQuả = 9;
                return {1:'Tốn', 2:'Khôn', 3:'Chấn', 4:'Khôn', 5:'Cấn', 6:'Càn', 7:'Đoài', 8:'Cấn', 9:'Ly'}[kếtQuả];
            }
        }

        function recalculateFate() {
            const year = parseInt(document.getElementById('birthYear').value) || 1990;
            const gender = document.getElementById('gender').value;
            chủMệnh = tínhCungPhi(year, gender);
            
            fateTxt.innerText = `Mệnh: ${chủMệnh} (${bátTrạchMap[chủMệnh].group})`;
            elementTxt.innerText = `Hành ${bátTrạchMap[chủMệnh].el}`;
            elementTxt.className = `element-badge ${bátTrạchMap[chủMệnh].class}`;
            
            updateCompassUI(currentHeading);
        }

        function getSonByHeading(heading) {
            return sonHuong24.find(son => {
                if (son.min > son.max) { // Trường hợp vòng qua số 0 (Sơn Tý)
                    return heading >= son.min || heading < son.max;
                }
                return heading >= son.min && heading < son.max;
            }) || sonHuong24[1];
        }

        function updateCompassUI(heading) {
            currentHeading = (Math.round(heading) + 360) % 360;
            compass.style.transform = `rotate(${-currentHeading}deg)`;
            needle.style.transform = `rotate(0deg)`;
            compassSlider.value = currentHeading;

            let currentCung = ""; 
            if (currentHeading >= 337.5 || currentHeading < 22.5) { currentCung = "BẮC (KHẢM)"; currentCode = "N"; }
            else if (currentHeading >= 22.5 && currentHeading < 67.5) { currentCung = "ĐÔNG BẮC (CẤN)"; currentCode = "NE"; }
            else if (currentHeading >= 67.5 && currentHeading < 112.5) { currentCung = "ĐÔNG (CHẤN)"; currentCode = "E"; }
            else if (currentHeading >= 112.5 && currentHeading < 157.5) { currentCung = "ĐÔNG NAM (TỐN)"; currentCode = "SE"; }
            else if (currentHeading >= 157.5 && currentHeading < 202.5) { currentCung = "NAM (LY)"; currentCode = "S"; }
            else if (currentHeading >= 202.5 && currentHeading < 247.5) { currentCung = "TÂY NAM (KHÔN)"; currentCode = "SW"; }
            else if (currentHeading >= 247.5 && currentHeading < 292.5) { currentCung = "TÂY (ĐOÀI)"; currentCode = "W"; }
            else if (currentHeading >= 292.5 && currentHeading < 337.5) { currentCung = "TÂY BẮC (CÀN)"; currentCode = "NW"; }

            const sơnHiệnTại = getSonByHeading(currentHeading);
            degreeTxt.innerHTML = `${currentHeading}° - Phương ${currentCung} <br> <span class="element-badge ${sơnHiệnTại.class}">Sơn ${sơnHiệnTại.name} (${sơnHiệnTại.element})</span>`;

            const cungTrạch = bátTrạchMap[chủMệnh][currentCode];
            const thôngTinCung = cungYNghea[cungTrạch];
            const mụcĐích = document.getElementById('purpose').value;

            // PHÂN TÍCH THEO TỪNG MỤC ĐÍCH KHẢO SÁT DƯƠNG TRẠCH
            if (mụcĐích === 'house' || mụcĐích === 'desk' || mụcĐích === 'bed') {
                let thietBi = mụcĐích === 'house' ? 'CỬA CHÍNH / BÀN THỜ' : (mụcĐích === 'desk' ? 'BÀN LÀM VIỆC' : 'ĐẦU GIƯỜNG NGỦ');
                judgmentBox.innerText = `${cungTrạch}`;
                
                if (thôngTinCung.cát) {
                    judgmentBox.className = "judgment-badge bg-good";
                    detailBox.innerHTML = `<span class="good-text">◆ HƯỚNG CÁT LỢI ĐỂ ĐẶT ${thietBi}:</span><br>${thôngTinCung.iy}<br><br><em>Mật pháp:</em> Hướng máy (Camera trước) đang nhìn về phương vị sinh vượng khí. Đặt ${thietBi} nhìn thẳng ra góc này giúp thu nạp năng lượng cát lành, gia tăng phúc đức.`;
                } else {
                    judgmentBox.className = "judgment-badge bg-bad";
                    detailBox.innerHTML = `<span class="warn-text">◆ PHƯƠNG VỊ PHẠM HUNG (XẤU KỴ):</span><br>${thôngTinCung.iy}<br><br><em>Hóa giải:</em> Tránh bố trí ${thietBi} hướng về góc này. Nếu không thể thay đổi vị trí vật lý, buộc phải dùng vật phẩm phong thủy thuộc hành thích hợp để hóa sát khí của sơn ${sơnHiệnTại.name}.`;
                }
            } else if (mụcĐích === 'kitchen') {
                // Nguyên tắc đặt Bếp: TỌA HUNG HƯỚNG CÁT
                judgmentBox.innerText = `Tọa Bếp: ${cungTrạch}`;
                if (!thôngTinCung.cát) {
                    judgmentBox.className = "judgment-badge bg-good";
                    detailBox.innerHTML = `<span class="good-text">◆ TỌA BẾP ĐẮC CÁCH ĐẠI CÁT:</span><br>Vị trí này thuộc cung hung <span class="warn-text">(${cungTrạch})</span>.<br><br><em>Mật pháp:</em> Rất tốt! Khi đặt bếp đè lên cung hung này, Hỏa khí của bếp nấu sẽ thiêu rụi hung khí và tai ách của cung ${cungTrạch}. Lưu ý, mặt lưng của người nấu (hướng công tắc bếp) nên quay về một phương vị Cát khác để đón khí tốt.`;
                } else {
                    judgmentBox.className = "judgment-badge bg-bad";
                    detailBox.innerHTML = `<span class="warn-text">◆ TỌA BẾP PHẠM ĐẠI KỴ (XẤU):</span><br>Bạn đang đặt bếp đè lên cung cát vượng đức <span class="good-text">(${cungTrạch})</span>.<br><br><em>Cảnh báo:</em> Lửa bếp rất mạnh sẽ thiêu cháy toàn bộ may mắn, tài lộc của cung này mang lại cho bản mệnh. Cần chuyển bếp sang các góc hung khác (như Tuyệt Mệnh, Lục Sát...) để đè hung khí.`;
                }
            }
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || (event.alpha ? (360 - event.alpha) : null);
            if (heading !== null) { updateCompassUI(heading); }
        }

        // CHỨC NĂNG LƯU TRỮ DANH SÁCH THÀNH VIÊN (LOCALSTORAGE)
        function saveMember() {
            const name = document.getElementById('memberName').value.trim();
            const year = document.getElementById('birthYear').value;
            const gender = document.getElementById('gender').value;
            
            if(!name) { alert("Vui lòng nhập tên!"); return; }
            
            let members = JSON.parse(localStorage.getItem('pt_members')) || {};
            members[name] = { year, gender };
            localStorage.setItem('pt_members', JSON.stringify(members));
            
            updateMemberListSelect(name);
            alert(`Đã lưu tuổi của: ${name}`);
        }

        function loadMember() {
            const select = document.getElementById('memberList');
            const name = select.value;
            if(!name) return;
            
            let members = JSON.parse(localStorage.getItem('pt_members')) || {};
            if(members[name]) {
                document.getElementById('memberName').value = name;
                document.getElementById('birthYear').value = members[name].year;
                document.getElementById('gender').value = members[name].gender;
                recalculateFate();
            }
        }

        function deleteMember() {
            const name = document.getElementById('memberList').value;
            if(!name) return;
            
            if(confirm(`Bạn có chắc muốn xóa tuổi của: ${name}?`)) {
                let members = JSON.parse(localStorage.getItem('pt_members')) || {};
                delete members[name];
                localStorage.setItem('pt_members', JSON.stringify(members));
                updateMemberListSelect();
                recalculateFate();
            }
        }

        function updateMemberListSelect(selectedName = '') {
            const select = document.getElementById('memberList');
            select.innerHTML = '';
            let members = JSON.parse(localStorage.getItem('pt_members')) || {};
            
            let hasData = false;
            for(let key in members) {
                hasData = true;
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = key;
                if(key === selectedName) opt.selected = true;
                select.appendChild(opt);
            }
            
            if(!hasData) {
                const opt = document.createElement('option');
                opt.innerText = "-- Chưa có thành viên --";
                select.appendChild(opt);
            }
        }

        // KHỞI TẠO HỆ THỐNG VAN HÀNH
        window.addEventListener('DOMContentLoaded', () => {
            render24Son();
            updateMemberListSelect();
            recalculateFate();
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                permBtn.style.display = 'block';
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        function requestPermission() {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response == 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        permBtn.style.display = 'none';
                    } else {
                        alert("Quyền truy cập cảm biến bị từ chối!");
                    }
                }).catch(console.error);
        }

        function manualRotate(value) { updateCompassUI(value); }
    </script>
</body>
