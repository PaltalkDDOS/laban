<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đại Thuật La Kinh Phong Thủy Tối Thượng - Thái Thông</title>
    <style>
        :root {
            --gold: #dfb76c;
            --dark: #070707;
            --panel: #161616;
            --text: #e0e0e0;
            --red: #ff3b30;
            --green: #30d158;
            --blue: #0a84ff;
            --gray: #8e8e93;
            --orange-bright: #ff6600;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 30px;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            background: linear-gradient(180deg, #1f1a10 0%, var(--dark) 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .header h1 {
            color: var(--gold);
            font-size: 1.1rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .header-copyright {
            color: var(--gold); 
            font-size: 0.75rem; 
            margin-top: 6px; 
            font-weight: bold; 
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(223, 183, 108, 0.4);
        }

        .user-input-panel {
            width: 92%;
            max-width: 430px;
            background: #1a1510;
            border: 1px solid #443322;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            position: relative;
            z-index: 10;
        }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            background: #2a2218;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
            height: 38px;
            text-align: center;
        }

        .form-group input#userName {
            text-align: left;
        }

        /* Khung nhập ngày sinh thủ công hàng ngang gán sát nhau */
        .manual-date-container {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .manual-date-container input {
            flex: 1;
            width: 100%;
        }

        .btn-action-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-main {
            flex: 1;
            background: linear-gradient(180deg, #c5a059, #9a7b3e);
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-reset {
            background: linear-gradient(180deg, var(--orange-bright), #cc5200);
            color: #fff;
            border: 1px solid #ffaa66;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.3);
            transition: all 0.2s ease;
        }
        
        .btn-reset:hover {
            background: linear-gradient(180deg, #ff8833, var(--orange-bright));
            box-shadow: 0 6px 14px rgba(255, 102, 0, 0.45);
        }

        .btn-reset:active {
            transform: scale(0.95);
        }

        .btn-reset.executing {
            animation: pulse-execute-effect 0.4s ease-in-out;
        }

        @keyframes pulse-execute-effect {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 15px rgba(255, 102, 0, 0.8); }
            100% { transform: scale(1); opacity: 1; }
        }

        .saved-list-panel {
            width: 92%;
            max-width: 430px;
            background: #111;
            margin-top: 8px;
            border-radius: 6px;
            padding: 6px;
            border: 1px dashed #332211;
            position: relative;
            z-index: 10;
        }

        .saved-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .saved-chip {
            background: #252018;
            border: 1px solid #554433;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: #ddd;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .saved-chip:hover { border-color: var(--gold); }
        .saved-chip .del-btn { color: var(--red); font-weight: bold; margin-left: 4px; }

        /* KHUNG LA BÀN */
        .compass-container {
            position: relative;
            width: 320px;
            height: 320px;
            max-width: 88vw;
            max-height: 88vw;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }

        .cross-line-v {
            position: absolute;
            width: 1.5px;
            height: 100%;
            background: var(--red);
            z-index: 10;
            pointer-events: none;
        }

        .cross-line-h {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(255, 59, 48, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        .compass-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px double var(--gold);
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 65%, #111 100%);
            box-shadow: 0 0 20px rgba(223, 183, 108, 0.2);
            z-index: 1;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        .compass-watermark {
            position: absolute;
            bottom: 25%;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            color: rgba(223, 183, 108, 0.3);
            font-weight: bold;
            z-index: 2;
            pointer-events: none;
            letter-spacing: 2px;
        }

        /* KIM THỰC TẾ (CHỈ THẲNG LÊN TRÊN ĐỂ XOAY PHƯƠNG VỊ) */
        .center-needle {
            position: absolute;
            width: 8px;
            height: 85%;
            background: linear-gradient(to bottom, var(--red) 50%, #ccc 50%);
            clip-path: polygon(50% 0%, 100% 15%, 60% 15%, 60% 85%, 100% 85%, 50% 100%, 0% 85%, 40% 85%, 40% 15%, 0% 15%);
            z-index: 8;
            pointer-events: none;
            transform: rotate(0deg);
        }

        /* KIM ẢO MỜ ĐỊNH HƯỚNG TẦM PHƯƠNG KHẢO SÁT */
        .ghost-needle {
            position: absolute;
            width: 6px;
            height: 80%;
            background: linear-gradient(to bottom, #ffcc00 50%, rgba(255, 204, 0, 0.3) 50%);
            clip-path: polygon(50% 0%, 100% 15%, 60% 15%, 60% 85%, 100% 85%, 50% 100%, 0% 85%, 40% 85%, 40% 15%, 0% 15%);
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.2s ease-out, opacity 0.3s;
        }

        .center-pin {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--gold);
            border-radius: 50%;
            z-index: 12;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        .direction-label {
            position: absolute;
            font-weight: bold;
            font-size: 0.65rem;
            text-align: center;
            width: 44px;
            height: 30px;
            line-height: 1.1;
        }
        
        .lbl-kham { color: var(--red); top: 12px; left: calc(50% - 22px); } 
        .lbl-ly { color: var(--gold); bottom: 12px; left: calc(50% - 22px); transform: rotate(180deg); } 
        .lbl-chan { color: var(--gold); right: 8px; top: calc(50% - 15px); transform: rotate(90deg); } 
        .lbl-doai { color: var(--gold); left: 8px; top: calc(50% - 15px); transform: rotate(-90deg); } 
        .lbl-can { color: var(--gold); top: 40px; right: 40px; transform: rotate(45deg); } 
        .lbl-ton { color: var(--gold); bottom: 40px; right: 40px; transform: rotate(135deg); } 
        .lbl-khon { color: var(--gold); bottom: 40px; left: 40px; transform: rotate(-135deg); } 
        .lbl-can2 { color: var(--gold); top: 40px; left: 40px; transform: rotate(-45deg); }

        .son-ring-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .son-item {
            position: absolute;
            top: 0;
            left: 50%;
            width: 20px;
            margin-left: -10px;
            height: 50%;
            transform-origin: bottom center;
            font-size: 0.5rem;
            color: #8a8a8f;
            text-align: center;
            padding-top: 45px;
        }

        .status-panel {
            width: 92%;
            max-width: 430px;
            background: var(--panel);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
            position: relative;
            z-index: 10;
        }

        .degree-display {
            font-size: 1rem;
            color: var(--gold);
            font-weight: bold;
        }

        .element-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: bold;
        }

        .fate-display {
            font-size: 0.8rem;
            color: #fff;
            background: #222;
            padding: 6px;
            margin: 6px 0;
            border-radius: 4px;
            border-left: 4px solid var(--gold);
            text-align: left;
        }

        .judgment-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .bg-good { background-color: rgba(48, 209, 88, 0.15); color: var(--green); border: 1px solid var(--green); }
        .bg-bad { background-color: rgba(255, 59, 48, 0.15); color: var(--red); border: 1px solid var(--red); }

        .control-box {
            width: 92%;
            max-width: 430px;
            background: #111;
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }
        .slider { width: 100%; accent-color: var(--gold); height: 20px; }

        #permission-btn {
            display: none;
            background: var(--red);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 12px;
            width: 92%;
            max-width: 430px;
            position: relative;
            z-index: 10;
        }

        .directions-list-panel {
            width: 92%;
            max-width: 430px;
            background: var(--panel);
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
            z-index: 10;
        }

        .list-title {
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            text-align: center;
        }

        .direction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d0d;
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            border-left: 4px solid #333;
        }

        .direction-item.good { border-left-color: var(--green); }
        .direction-item.bad { border-left-color: var(--red); }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .item-name { font-weight: bold; color: #fff; }
        .item-cung { font-size: 0.7rem; }

        .btn-rotate {
            background: #2a2218;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .explanation-panel {
            width: 92%;
            max-width: 430px;
            background: var(--panel);
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 12px;
            position: relative;
            z-index: 10;
        }

        .detail-content {
            background: #080808;
            border-left: 3px solid var(--gold);
            padding: 10px;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .cure-box {
            margin-top: 10px;
            padding: 10px;
            background: #220b0b;
            border: 1px solid var(--red);
            border-radius: 4px;
        }

        .cure-title {
            color: #ff453a;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Custom Alert Dialog CSS */
        .custom-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .custom-alert-overlay.show { opacity: 1; pointer-events: auto; }
        .custom-alert-box {
            background: #221410; border: 2px solid var(--orange-bright);
            width: 85%; max-width: 320px; padding: 20px; border-radius: 10px;
            text-align: center; box-shadow: 0 0 20px rgba(255,102,0,0.5);
            transform: scale(0.8); transition: transform 0.3s ease;
        }
        .custom-alert-overlay.show .custom-alert-box { transform: scale(1); }
        .custom-alert-msg { color: #fff; font-size: 0.95rem; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
        .custom-alert-btn {
            background: var(--orange-bright); color: #fff; border: none;
            padding: 8px 24px; border-radius: 4px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
        }
        
        .warn-text { color: var(--red); font-weight: bold; }
        .good-text { color: var(--green); font-weight: bold; }
        .gold-text { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ĐẠI THUẬT LA KINH PHONG THỦY</h1>
        <div class="header-copyright">&copy; BẢN QUYỀN HỆ THỐNG: THÁI THÔNG</div>
    </div>

    <div class="user-input-panel">
        <div class="form-row">
            <div class="form-group" style="flex: 1.2;">
                <label>Họ tên chủ mệnh:</label>
                <input type="text" id="userName" value="Người Tầm Phương" 
                       onfocus="if(this.value==='Người Tầm Phương') { this.value=''; this.style.color='#fff'; }" 
                       onblur="if(this.value.trim()==='') { this.value='Người Tầm Phương'; this.style.color='#aaa'; }" 
                       oninput="recalculateFate()">
            </div>
            <div class="form-group" style="flex: 0.8;">
                <label>Giới tính:</label>
                <select id="gender" onchange="recalculateFate()">
                    <option value="male">Nam Mạng</option>
                    <option value="female">Nữ Mạng</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Sinh ngày / tháng / năm (Dương lịch):</label>
                <div class="manual-date-container">
                    <input type="number" id="birthDay" placeholder="Ngày" min="1" max="31" oninput="validateDayInput(this)">
                    <input type="number" id="birthMonth" placeholder="Tháng" min="1" max="12" oninput="validateMonthInput(this)">
                    <input type="number" id="birthYear" placeholder="Năm" min="1900" max="2026" oninput="validateYearInput(this)">
                </div>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 6px;">
            <label>Mục đích tầm phương vị dương trạch:</label>
            <select id="purpose" onchange="recalculateFate()">
                <option value="">-- Xem hướng tự do nguyên bản (Không áp bộ lọc đồ đạc) --</option>
                <option value="house">Xem hướng Nhà, Cửa Chính (Cần Hướng Cát)</option>
                <option value="altar">Xem hướng đặt BÀN THỜ (Cần Hướng Cát)</option>
                <option value="bed">Xem hướng đầu GIƯỜNG NGỦ (Cần Hướng Cát)</option>
                <option value="workspace">Xem hướng đặt BÀN LÀM VIỆC (Cần Hướng Cát)</option>
                <option value="kitchen">Xem vị trí đặt BẾP NẤU (Tọa Hung Hướng Cát)</option>
                <option value="toilet">Xem vị trí nhà vệ sinh / WC (Tọa Hung giải uế)</option>
            </select>
        </div>

        <div class="btn-action-row">
            <button class="btn-main" onclick="saveCurrentMember()">Lưu Tuổi Gia Đình</button>
            <button class="btn-reset" id="btnReset" onclick="clearAllData()">Làm Mới Trang</button>
        </div>
    </div>

    <div class="saved-list-panel" id="savedPanel" style="display: none;">
        <div class="saved-container" id="savedContainer"></div>
    </div>

    <div class="compass-container">
        <div class="cross-line-v"></div>
        <div class="cross-line-h"></div>
        <div class="center-pin"></div>
        <div class="center-needle" id="needle"></div>
        <div class="ghost-needle" id="ghostNeedle"></div>
        
        <div class="compass-dial" id="compass">
            <div class="compass-watermark">THÁI THÔNG</div>
            <div class="direction-label lbl-kham">BẮC<br>▲<br>KHẢM</div>
            <div class="direction-label lbl-can">Đ.Bắc<br>CẤN</div>
            <div class="direction-label lbl-chan">ĐÔNG<br>CHẤN</div>
            <div class="direction-label lbl-ton">Đ.NAM<br>TỐN</div>
            <div class="direction-label lbl-ly">NAM<br>LY</div>
            <div class="direction-label lbl-khon">T.NAM<br>KHÔN</div>
            <div class="direction-label lbl-doai">TÂY<br>ĐOÀI</div>
            <div class="direction-label lbl-can2">T.BẮC<br>CÀN</div>

            <div class="son-ring-text" id="sonRing"></div>
        </div>
    </div>

    <button id="permission-btn" onclick="requestPermission()">KÍCH HOẠT SENSOR ĐIỆN THOẠI</button>

    <div class="status-panel">
        <div class="degree-display" id="degree-txt">0° - CUNG KHẢM (BẮC)</div>
        <div id="element-box"></div>
        <div class="fate-display" id="fate-txt">Mệnh chủ: ...</div>
        <div id="judgment-box" class="judgment-badge bg-good">...</div>
    </div>

    <div class="control-box">
        <input type="range" min="0" max="360" value="0" class="slider" id="compassSlider" oninput="manualRotate(this.value)">
    </div>

    <div class="directions-list-panel">
        <p class="list-title" id="list-panel-title">Danh Sách Hướng Gợi Ý</p>
        <div id="directions-container"></div>
    </div>

    <div class="explanation-panel">
        <div class="detail-content" id="detail-box">Đang khởi tạo mật pháp dữ liệu...</div>
    </div>

    <div class="custom-alert-overlay" id="customAlert">
        <div class="custom-alert-box">
            <div class="custom-alert-msg" id="customAlertMsg">Thông báo lỗi nhập liệu!</div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">Xác Nhận</button>
        </div>
    </div>

    <script>
        const compass = document.getElementById('compass');
        const needle = document.getElementById('needle');
        const ghostNeedle = document.getElementById('ghostNeedle');
        const degreeTxt = document.getElementById('degree-txt');
        const elementBox = document.getElementById('element-box');
        const fateTxt = document.getElementById('fate-txt');
        const judgmentBox = document.getElementById('judgment-box');
        const detailBox = document.getElementById('detail-box');
        const compassSlider = document.getElementById('compassSlider');
        const permBtn = document.getElementById('permission-btn');
        const directionsContainer = document.getElementById('directions-container');
        const listPanelTitle = document.getElementById('list-panel-title');
        const sonRing = document.getElementById('sonRing');
        const savedContainer = document.getElementById('savedContainer');
        const savedPanel = document.getElementById('savedPanel');
        const customAlert = document.getElementById('customAlert');
        const customAlertMsg = document.getElementById('customAlertMsg');

        const son24Data = [
            { name: "Tý", start: 352.5, end: 7.5 }, { name: "Quý", start: 7.5, end: 22.5 }, { name: "Sửu", start: 22.5, end: 37.5 },
            { name: "Cấn", start: 37.5, end: 52.5 }, { name: "Dần", start: 52.5, end: 67.5 }, { name: "Giáp", start: 67.5, end: 82.5 },
            { name: "Mão", start: 82.5, end: 97.5 }, { name: "Ất", start: 97.5, end: 112.5 }, { name: "Thìn", start: 112.5, end: 127.5 },
            { name: "Tốn", start: 127.5, end: 142.5 }, { name: "Tỵ", start: 142.5, end: 157.5 }, { name: "Bính", start: 157.5, end: 172.5 },

        // Tự động nhảy ô nhập liệu thủ công thông minh
        function validateDayInput(el) {
            let val = parseInt(el.value);
            if (el.value.length >= 2) {
                if (val < 1 || val > 31) {
                    showAlert("❌ Ngày nhập vào sai quy luật (Chỉ được phép từ 1 đến 31). Hệ thống tự reset!");
                    el.value = "";
                    return;
                }
                document.getElementById('birthMonth').focus();
            }
            recalculateFate();
        }

                    showAlert("❌ Tháng nhập vào không đúng quy luật (Chỉ từ tháng 1 đến tháng 12)!");
                    el.value = "";
                    return;
                }
                document.getElementById('birthYear').focus();
            }
            recalculateFate();

        function validateYearInput(el) {

                    showAlert("❌ Năm sinh không hợp lệ (Phải từ năm 1900 đến 2026)!");
                    el.value = "";
                    return;
                }
                el.blur();
            }
            recalculateFate();
        }

        function tínhCungPhi(năm, giớiTính) {
            let sốDư = năm % 9;
            if (sốDư === 0) sốDư = 9;
            if (giớiTính === 'male') {
                let kếtQuả = (11 - sốDư) % 9;
                if (kếtQuả === 0) kếtQuả = 9;
                return {1:'Khảm', 2:'Khôn', 3:'Chấn', 4:'Tốn', 5:'Khôn', 6:'Càn', 7:'Đoài', 8:'Cấn', 9:'Ly'}[kếtQuả];
            } else {
                let kếtQuả = (sốDư + 4) % 9;
                if (kếtQuả === 0) kếtQuả = 9;
                return {1:'Tốn', 2:'Khôn', 3:'Chấn', 4:'Khôn', 5:'Cấn', 6:'Càn', 7:'Đoài', 8:'Cấn', 9:'Ly'}[kếtQuả];
            }
        }

            // Hàm kiểm định độ sai lệch phần cứng kim la bàn thực tế

                return "<br><span style='color:var(--green); font-weight:bold;'>✓ KIM LA BÀN ĐÃ ĐƯỢC CHUẨN HÓA KHÔNG SAI LỆCH VỚI TỪ TRƯỜNG TRÁI ĐẤT.</span>";
            } else {
                return "<br><span style='color:var(--orange-bright);'>⚠️ Không tìm thấy Sensor! Đang sử dụng giả lập con trượt chuẩn góc tuyệt đối.</span>";
            }
        }

        function recalculateFate() {
            const name = document.getElementById('userName').value || "Chủ mệnh";
            const gender = document.getElementById('gender').value;
            const day = document.getElementById('birthDay').value;
            const month = document.getElementById('birthMonth').value;
            const year = document.getElementById('birthYear').value;
            
            if (!day || !month || !year || year.length < 4) {
                fateTxt.innerText = `${name}: Đo hướng tự do nguyên bản (Chưa nhập đủ Ngày/Tháng/Năm)`;
                directionsContainer.innerHTML = "<div style='font-size:0.8rem;color:#8a8a8f;text-align:center;padding:10px;'>Vui lòng nhập đầy đủ ngày sinh để kích hoạt sơ đồ gợi ý Cát/Hung</div>";
                listPanelTitle.innerText = "Danh Sách Hướng Gợi Ý";
                updateCompassUI(currentHeading);
                return;
            }

            let nămTínhThủy = parseInt(year);
            let tháng = parseInt(month);
            let ngày = parseInt(day);

            // Kiểm tra ngày tối đa trong tháng
            let maxDays = new Date(nămTínhThủy, tháng, 0).getDate();
            if (ngày > maxDays) {
                showAlert(`❌ Tháng ${tháng}/${nămTínhThủy} chỉ có tối đa ${maxDays} ngày! Bạn nhập quá quy luật.`);
                document.getElementById('birthDay').value = "";
                return;
            }

            // Tính tiết khí lập xuân phong thủy
            if (tháng === 1 || (tháng === 2 && ngày < 4)) { 
                nămTínhThủy -= 1; 
            }
            
            chủMệnh = tínhCungPhi(nămTínhThủy, gender);
            fateTxt.innerText = `${name}: Cung ${chủMệnh} (${bátTrạchMap[chủMệnh].group}) - Bản Mệnh Ngũ Hành: ${bátTrạchMap[chủMệnh].element}`;
            
            generateDirectionsList();
            updateCompassUI(currentHeading);
        }

        function generateDirectionsList() {
            const mụcĐích = document.getElementById('purpose').value;
            
            if (!mụcĐích) {
                directionsContainer.innerHTML = "<div style='font-size:0.8rem;color:#8a8a8f;text-align:center;padding:10px;'>Chọn mục đích dương trạch (Nhà, bếp, thờ...) để xem danh sách gợi ý tương ứng</div>";
                listPanelTitle.innerText = "Danh Sách Hướng Gợi Ý";
                return;
            }

            let listDirections = [];
            directionMeta.forEach(dir => {
                const cungTrạch = bátTrạchMap[chủMệnh][dir.code];
                const isCat = cungPhầnTrăm[cungTrạch].cát;
                let hopPhongThuy = false;

                if (['house', 'altar', 'bed', 'workspace'].includes(mụcĐích)) {
                    hopPhongThuy = isCat; 
                } else {
                    hopPhongThuy = !isCat; 
                }

                listDirections.push({
                    ...dir, cungTrạch: cungTrạch, isCat: isCat, hopPhongThuy: hopPhongThuy
                });
            });

            listDirections.sort((a, b) => b.hopPhongThuy - a.hopPhongThuy);

            const cấuHìnhTiêuĐề = {
                'bed': "Ưu tiên Hướng Đầu Giường (Cần quay về Cát vị)",
                'house': "Ưu tiên Hướng Nhà / Cửa Chính (Cần nhìn về Cát vị)",
                'altar': "Ưu tiên Hướng Mặt Bàn Thờ (Cần nhìn về Cát vị)",
                'workspace': "Ưu tiên Hướng Mặt Bàn Làm Việc (Cần nhìn về Cát vị)",
                'kitchen': "Ưu tiên Tọa vị đặt Bếp nấu (Cần đặt đè lên Hung vị)",
                'toilet': "Ưu tiên Tọa vị đặt nhà vệ sinh (Cần đặt đè lên Hung vị)"
            };
            listPanelTitle.innerText = cấuHìnhTiêuĐề[mụcĐích];

            directionsContainer.innerHTML = "";
            listDirections.forEach(item => {
                const badgeClass = item.hopPhongThuy ? 'good' : 'bad';
                const statusText = item.hopPhongThuy ? '🟢 PHÙ HỢP TỐT' : '❌ KHÔNG PHÙ HỢP';
                const textColorStyle = item.hopPhongThuy ? 'color: var(--green); font-weight: bold;' : 'color: var(--red); font-weight: bold;';
                
                const div = document.createElement('div');
                div.className = `direction-item ${badgeClass}`;
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name} ➔ <span style="${textColorStyle}">${item.cungTrạch}</span></span>
                        <span class="item-cung" style="${textColorStyle}">${statusText}</span>
                    </div>
                    <button class="btn-rotate" onclick="triggerGhostNeedle(${item.angle})">Xoay thử</button>
                `;
                directionsContainer.appendChild(div);
            });
        }

        function triggerGhostNeedle(angle) {
            targetAngle = angle;
            ghostNeedle.style.opacity = "1";
            
            updateCompassUI(currentHeading);
            
            let sơnThử = tìmSơnHướng(angle);
            detailBox.innerHTML = `<span class="gold-text">◆ ĐANG BẬT KIM VÀNG XOAY THỬ:</span><br>Kim ảo màu vàng đang chỉ mốc <span class="gold-text">${angle}°</span> (Sơn <span class="good-text">${sơnThử}</span>) nằm mờ phía dưới.<br>Hãy xoay thiết bị hoặc vuốt la bàn bằng tay sao cho <span class="warn-text">Kim Đỏ trùng khớp hoàn toàn lên vị trí Kim Vàng mờ</span> để đón chuẩn hướng phương vị.`;
        }

        function tìmSơnHướng(heading) {
            let sơnTìmThấy = "Tý";
            son24Data.forEach(son => {
                if (son.start > son.end) {
                    if (heading >= son.start || heading < son.end) sơnTìmThấy = son.name;
                } else {
                    if (heading >= son.start && heading < son.end) sơnTìmThấy = son.name;
                }
            });
            return sơnTìmThấy;
        }

        function updateCompassUI(heading) {
            currentHeading = Math.round(heading);
            // La bàn xoay ngược lại với góc quay hướng để kim đỏ luôn cố định chỉ hướng thực tế trước mặt
            compass.style.transform = `rotate(${-currentHeading}deg)`;
            compassSlider.value = currentHeading;

            if (targetAngle !== null) {
                ghostNeedle.style.transform = `rotate(${targetAngle - currentHeading}deg)`;
            }

            let currentCung = ""; 
            if (currentHeading >= 338 || currentHeading < 23) { currentCung = "KHẢM (BẮC)"; currentCode = "N"; }
            else if (currentHeading >= 23 && currentHeading < 68) { currentCung = "CẤN (ĐÔNG BẮC)"; currentCode = "NE"; }
            else if (currentHeading >= 68 && currentHeading < 113) { currentCung = "CHẤN (ĐÔNG)"; currentCode = "E"; }
            else if (currentHeading >= 113 && currentHeading < 158) { currentCung = "TỐN (ĐÔNG NAM)"; currentCode = "SE"; }
            else if (currentHeading >= 158 && currentHeading < 203) { currentCung = "LY (NAM)"; currentCode = "S"; }
            else if (currentHeading >= 203 && currentHeading < 248) { currentCung = "KHÔN (TÂY NAM)"; currentCode = "SW"; }
            else if (currentHeading >= 248 && currentHeading < 293) { currentCung = "ĐOÀI (TÂY)"; currentCode = "W"; }
            else if (currentHeading >= 293 && currentHeading < 338) { currentCung = "CÀN (TÂY BẮC)"; currentCode = "NW"; }

            let sơnHiệnTại = tìmSơnHướng(currentHeading);
            let checkHardwareStr = checkCompassAccuracy();
            degreeTxt.innerHTML = `${currentHeading}° - Phương ${currentCung} - Sơn ${sơnHiệnTại} ${checkHardwareStr}`;

            const hasDateInput = document.getElementById('birthDay').value && document.getElementById('birthMonth').value && document.getElementById('birthYear').value;

            if (!hasDateInput) {
                elementBox.innerHTML = `<span class="element-badge" style="background: #3a3a3c;">Phương vị: ${phươngVịThiếtLập[currentCode].ngũHành}</span>`;
                judgmentBox.innerText = "ĐO HƯỚNG CHÍNH XÁC";
                judgmentBox.className = "judgment-badge";
                judgmentBox.removeAttribute("style");
                judgmentBox.style.backgroundColor = "#222";
                judgmentBox.style.color = "var(--gold)";
                judgmentBox.style.border = "1px solid var(--gold)";
                detailBox.innerHTML = `Hệ thống đang chạy ở chế độ la bàn cơ bản chuẩn xác cao.<br>Hướng hiện tại: góc <span class="gold-text">${currentHeading}°</span>, phương <b>${currentCung}</b>, thích hợp để đo đạc thực tế địa hình đất đai dương trạch.`;
                return;
            }

            const hànhPhươngVị = phươngVịThiếtLập[currentCode].ngũHành;
            const hànhMệnhChủ = bátTrạchMap[chủMệnh].element;
            elementBox.innerHTML = `
                <span class="element-badge" style="background: #3a3a3c;">Phương vị: ${hànhPhươngVị}</span>
                <span class="element-badge" style="background: #2c2c2e; color: var(--gold)">Mệnh: ${hànhMệnhChủ}</span>
            `;

            const cungTrạch = bátTrạchMap[chủMệnh][currentCode];
            const thôngTinCung = cungPhầnTrăm[cungTrạch];
            const mụcĐích = document.getElementById('purpose').value;

            judgmentBox.removeAttribute("style");

            let tenThietBiTiengViet = "DƯƠNG TRẠCH";
            if(mụcĐích === 'house') tenThietBiTiengViet = "CỬA CHÍNH / NHÀ";
            if(mụcĐích === 'altar') tenThietBiTiengViet = "BÀN THỜ";
            if(mụcĐích === 'bed') tenThietBiTiengViet = "GIƯỜNG NGỦ";
            if(mụcĐích === 'workspace') tenThietBiTiengViet = "BÀN LÀM VIỆC";
            if(mụcĐích === 'kitchen') tenThietBiTiengViet = "BẾP NẤU";
            if(mụcĐích === 'toilet') tenThietBiTiengViet = "NHÀ VỆ SINH (WC)";

            if (!mụcĐích) {
                judgmentBox.innerText = `Cung vị: ${cungTrạch}`;
                judgmentBox.className = thôngTinCung.cát ? "judgment-badge bg-good" : "judgment-badge bg-bad";
                
                let htmlDetail = `Góc xoay <span class="gold-text">${currentHeading}°</span> đối chiếu mệnh cung ${chủMệnh} gặp cung tinh <span class="${thôngTinCung.cát ? 'good-text' : 'warn-text'}">${cungTrạch}</span>.<br>${thôngTinCung. ý_nghĩa}`;
                
                // Hiển thị mật pháp hóa giải tự động nếu phạm Cung Hung ở chế độ tự do cơ bản
                if (!thôngTinCung.cát && mậtPhápHóaGiải[cungTrạch] && mậtPhápHóaGiải[cungTrạch]['house']) {
                    htmlDetail += `
                        <div class="cure-box">
                            <div class="cure-title">❖ MẬT PHÁP HÓA GIẢI CHỦ MÀU ĐỎ: PHẠM ${cungTrạch.toUpperCase()}</div>
                            <span style="color: #ff453a; font-weight: bold;">[Cảnh cáo phạm thế sát ngôi nhà]:</span> ${mậtPhápHóaGiải[cungTrạch]['house']}
                        </div>
                    `;
                }
                detailBox.innerHTML = htmlDetail;
                return;
            }

            if (['house', 'altar', 'bed', 'workspace'].includes(mụcĐích)) {
                judgmentBox.innerText = `Hướng ${tenThietBiTiengViet}: ${cungTrạch}`;
                if (thôngTinCung.cát) {
                    judgmentBox.className = "judgment-badge bg-good";
                    detailBox.innerHTML = `<span class="good-text">◆ HƯỚNG CÁT (${cungTrạch.toUpperCase()}) - PHÙ HỢP TỐT:</span><br>${thôngTinCung.ý_nghĩa}<br><br>Phương vị cực kỳ lý tưởng để bố trí vị trí nhìn về (hướng) góc tọa độ ${currentHeading}°. Nhờ đón cát khí, gia đạo sẽ nhận được nhiều tài lộc và bình an viên mãn.`;
                } else {
                    judgmentBox.className = "judgment-badge bg-bad";
                    let htmlDetail = `<span class="warn-text">◆ HƯỚNG HUNG (${cungTrạch.toUpperCase()}) - NÊN TRÁNH TUYỆT ĐỐI:</span><br>${thôngTinCung.ý_nghĩa}<br><br>Tuyệt đối không đặt mặt hướng của ${tenThietBiTiengViet} nhìn thẳng về phương vị này. Phạm hung tinh sẽ tổn hao nguyên khí, tai ách liên miên.`;
                    
                    // Cơ chế Hóa giải thông minh phối hợp cung hung đơn vị thiết bị cụ thể
                    if (mậtPhápHóaGiải[cungTrạch] && mậtPhápHóaGiải[cungTrạch][mụcĐích]) {
                        htmlDetail += `
                            <div class="cure-box">
                                <div class="cure-title">❖ MẬT PHÁP HÓA GIẢI CHỦ MÀU ĐỎ: CỨU SÁT ${tenThietBiTiengViet} PHẠM ${cungTrạch.toUpperCase()}</div>
                                <span style="color: #ff453a; font-weight: bold;">[Bí truyền xử lý]:</span> ${mậtPhápHóaGiải[cungTrạch][mụcĐích]}
                            </div>
                        `;
                    }
                    detailBox.innerHTML = htmlDetail;
                }
            } 
            else {
                judgmentBox.innerText = `Tọa ${tenThietBiTiengViet}: ${cungTrạch}`;
                if (!thôngTinCung.cát) {
                    judgmentBox.className = "judgment-badge bg-good";
                    detailBox.innerHTML = `<span class="good-text">◆ TỌA HUNG ĐẮC CÁCH (${cungTrạch.toUpperCase()}) - RẤT TỐT:</span><br>Vị trí thuộc hung vị lý tưởng <span class="warn-text">(${cungTrạch})</span>.<br><br>Nguyên lý Tiêu Sát: Thiết bị xả uế hoặc sinh hỏa đun nấu đặt đè trên tọa độ hung tinh này sẽ "Lấy Độc Trị Độc", thiêu rụi hoàn toàn vận xui rủi, tai vạ ra khỏi ngôi nhà. Đạt chuẩn Tọa Hung Hướng Cát.`;
                } else {
                    judgmentBox.className = "judgment-badge bg-bad";
                    let htmlDetail = `<span class="warn-text">◆ TỌA CÁT PHẠM SÁT (${cungTrạch.toUpperCase()}) - ĐẠI KỴ PHONG THỦY:</span><br>Bạn đang đặt thiết bị đè trực tiếp lên mạch khí tốt lành <span class="good-text">(${cungTrạch})</span>.<br><br>Lưu ý nghiêm trọng: Tránh đặt bồn cầu hoặc lửa bếp đè tại đây để không thiêu rụi hay cuốn trôi phước báu, sức khỏe của gia đình.`;
                    
                    if (mậtPhápHóaGiải[cungTrạch] && mậtPhápHóaGiải[cungTrạch][mụcĐích]) {
                        htmlDetail += `
                            <div class="cure-box">
                                <div class="cure-title">❖ MẬT PHÁP HÓA GIẢI CHỦ MÀU ĐỎ: KHẮC PHỤC TỌA CÁT PHẠM SÁT CHO ${tenThietBiTiengViet}</div>
                                <span style="color: #ff453a; font-weight: bold;">[Giải pháp bắt buộc nếu đã lỡ đặt]:</span> Do thiết bị đè làm tiêu hao cung tốt ${cungTrạch}, hãy đặt thêm một chậu thạch anh ngũ sắc lớn kế bên thiết bị để giữ mạch long thần khí, cân bằng năng lượng bị đốt cháy/cuốn trôi.
                            </div>
                        `;
                    }
                    detailBox.innerHTML = htmlDetail;
                }
            }
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || (event.alpha ? (360 - event.alpha) : null);
            if (heading !== null) { 
                updateCompassUI(heading); 
            }
        }

        function manualRotate(value) { 
            updateCompassUI(value); 
        }

        function saveCurrentMember() {
            const name = document.getElementById('userName').value.trim();
            const gender = document.getElementById('gender').value;
            const day = document.getElementById('birthDay').value;
            const month = document.getElementById('birthMonth').value;
            const year = document.getElementById('birthYear').value;

            if(!name || name === "Người Tầm Phương") { showAlert("❌ Vui lòng điền họ tên thật của thành viên gia đình!"); return; }
            if(!day || !month || !year) { showAlert("❌ Vui lòng điền đầy đủ Ngày, Tháng, Năm sinh dương lịch!"); return; }

            let data = JSON.parse(localStorage.getItem('fengshui_members')) || [];
            data = data.filter(m => m.name !== name);
            data.push({ name, gender, birthDate: `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}` });
            localStorage.setItem('fengshui_members', JSON.stringify(data));
            
            loadSavedMembers();
        }

        function loadSavedMembers() {
            const data = JSON.parse(localStorage.getItem('fengshui_members')) || [];
            if(data.length === 0) {
                savedPanel.style.display = "none";
                return;
            }
            savedPanel.style.display = "block";
            savedContainer.innerHTML = "";
            
            data.forEach(m => {
                const chip = document.createElement('div');
                chip.className = 'saved-chip';
                chip.innerHTML = `
                    <span onclick="selectMember('${m.name}', '${m.gender}', '${m.birthDate}')">👤 ${m.name}</span>
                    <span class="del-btn" onclick="deleteMember(event, '${m.name}')">×</span>
                `;
                savedContainer.appendChild(chip);
            });
        }

        function selectMember(name, gender, birthDate) {
            document.getElementById('userName').value = name;
            document.getElementById('userName').style.color = '#fff';
            document.getElementById('gender').value = gender;
            
            const parts = birthDate.split('-');
            if(parts.length === 3) {
                document.getElementById('birthYear').value = parseInt(parts[0]);
                document.getElementById('birthMonth').value = parseInt(parts[1]);
                document.getElementById('birthDay').value = parseInt(parts[2]);
            }
            recalculateFate();
        }

        function deleteMember(e, name) {
            e.stopPropagation();
            let data = JSON.parse(localStorage.getItem('fengshui_members')) || [];
            data = data.filter(m => m.name !== name);
            localStorage.setItem('fengshui_members', JSON.stringify(data));
            loadSavedMembers();
        }

        function clearAllData() {
            const btnReset = document.getElementById('btnReset');
            btnReset.classList.add('executing');
            
            setTimeout(() => {
                btnReset.classList.remove('executing');
                
                const nameInput = document.getElementById('userName');
                nameInput.value = "Người Tầm Phương";
                nameInput.style.color = "#aaa";

                document.getElementById('birthDay').value = "";
                document.getElementById('birthMonth').value = "";
                document.getElementById('birthYear').value = "";
                document.getElementById('purpose').value = "";
                document.getElementById('gender').value = "male";

                currentHeading = 0;
                targetAngle = null;
                compass.style.transform = `rotate(0deg)`;
                ghostNeedle.style.transform = `rotate(0deg)`;
                ghostNeedle.style.opacity = "0";
                compassSlider.value = 0;

                degreeTxt.innerText = "0° - Phương KHẢM (BẮC) - Sơn Tý";
                elementBox.innerHTML = "";
                fateTxt.innerText = "Chế độ la bàn trống - Sẵn sàng xem hướng gốc chính xác";
                
                judgmentBox.innerText = "ĐO HƯỚNG CHÍNH XÁC";
                judgmentBox.className = "judgment-badge";
                judgmentBox.removeAttribute("style");
                judgmentBox.style.backgroundColor = "#222";
                judgmentBox.style.color = "var(--gold)";
                judgmentBox.style.border = "1px solid var(--gold)";
                
                detailBox.innerHTML = "Đã làm mới hệ thống sạch sẽ. La bàn đang hoạt động độc lập ở chế độ thô nguyên bản giúp đo đạc thực địa chuẩn xác nhất.";

                directionsContainer.innerHTML = "<div style='font-size:0.8rem;color:#8a8a8f;text-align:center;padding:10px;'>Vui lòng nhập ngày sinh để kích hoạt sơ đồ gợi ý Cát/Hung</div>";
                listPanelTitle.innerText = "Danh Sách Hướng Gợi Ý";
            }, 400);
        }

        window.addEventListener('DOMContentLoaded', () => {
            render24SonRing();
            loadSavedMembers();
            recalculateFate(); 
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                permBtn.style.display = 'block';
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        function requestPermission() {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response == 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        permBtn.style.display = 'none';
                    } else {
                        showAlert("❌ Cảm biến la bàn chưa được thiết bị cấp quyền truy cập!");
                    }
                }).catch(console.error);
        }

        /* BẢO MẬT NGẦM - THÁI THÔNG (Nhẹ nhàng, an toàn, không đơ máy) */
        (function() {
            const crText = "© BẢN QUYỀN HỆ THỐNG THUỘC VỀ THÁI THÔNG";
            console.log("%c" + crText, "color: #dfb76c; font-size: 16px; font-weight: bold; background: #161616; padding: 12px; border: 2px solid #dfb76c; border-radius: 8px;");
            
            document.addEventListener('contextmenu', function(e) {
                if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                    e.preventDefault();
                }
            }, false);

            document.addEventListener('copy', function(e) {
                e.clipboardData.setData('text/plain', 'Nội dung được bảo vệ. ' + crText);
                e.preventDefault();
            });

            const stealthWatermark = document.createElement('div');
            stealthWatermark.innerHTML = "THÁI THÔNG PHONG THỦY";
            stealthWatermark.style.cssText = "position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 12vw; color: rgba(255, 255, 255, 0.02); z-index: 0; pointer-events: none; font-weight: 900; user-select: none; white-space: nowrap; text-align: center;";
            document.body.appendChild(stealthWatermark);
        })();
    </script>
