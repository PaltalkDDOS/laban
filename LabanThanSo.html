<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đại Thuật La Kinh Phong Thủy Tối Thượng</title>
    <style>
        :root {
            --gold: #dfb76c;
            --dark: #070707;
            --panel: #121212;
            --text: #e0e0e0;
            --red: #ff3b30;
            --green: #30d158;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid var(--gold);
            width: 100%;
            background: linear-gradient(180deg, #1f1a10 0%, var(--dark) 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .header h1 {
            color: var(--gold);
            font-size: 1.25rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .panel {
            width: 90%;
            max-width: 460px;
            background: #1a1510;
            border: 1px solid #443322;
            padding: 15px;
            border-radius: 10px;
            margin: 12px 0;
            box-sizing: border-box;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 5px;
            display: block;
        }

        input, select {
            background: #2a2218;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 9px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .compass-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .compass-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 8px double var(--gold);
            border-radius: 50%;
            background: radial-gradient(circle, #222 0%, #050505 70%, #111 100%);
            box-shadow: 0 0 30px rgba(223, 183, 108, 0.25);
            transition: transform 0.1s ease-out;
        }

        .center-needle {
            position: absolute;
            width: 14px;
            height: 92%;
            background: linear-gradient(to bottom, var(--red) 50%, #ddd 50%);
            clip-path: polygon(50% 0%, 100% 15%, 60% 15%, 60% 85%, 100% 85%, 50% 100%, 0% 85%, 40% 85%, 40% 15%, 0% 15%);
            z-index: 3;
        }

        .center-pin {
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--gold);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 12px rgba(0,0,0,0.9);
        }

        .direction-label {
            position: absolute;
            font-weight: bold;
            font-size: 0.75rem;
            text-align: center;
            width: 65px;
            transform-origin: center center;
        }

        .status-panel {
            text-align: center;
        }

        .degree-display {
            font-size: 1.45rem;
            color: var(--gold);
            font-weight: bold;
        }

        .fate-display {
            font-size: 0.95rem;
            background: #222;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 5px solid var(--gold);
        }

        .judgment-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .bg-good { background-color: rgba(48, 209, 88, 0.25); color: var(--green); border: 1px solid var(--green); }
        .bg-bad { background-color: rgba(255, 59, 48, 0.25); color: var(--red); border: 1px solid var(--red); }

        .history-item {
            background: #222;
            padding: 10px;
            margin: 6px 0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            background: #2a2218;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .active { background: var(--gold); color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ĐẠI THUẬT LA KINH PHONG THỦY TỐI THƯỢNG</h1>
    </div>

    <!-- Quản lý tuổi -->
    <div class="panel">
        <label>Chọn / Thêm tuổi:</label>
        <select id="profile-select" onchange="loadProfile()" style="width:100%"></select>
        <div style="margin-top:8px">
            <input type="text" id="new-name" placeholder="Tên (ví dụ: Anh A)" style="width:48%; display:inline-block">
            <input type="number" id="new-year" placeholder="Năm sinh" style="width:25%; display:inline-block">
            <select id="new-gender" style="width:22%; display:inline-block">
                <option value="male">Nam</option>
                <option value="female">Nữ</option>
            </select>
            <button onclick="addProfile()" style="margin-left:5px">Thêm</button>
        </div>
    </div>

    <div class="panel">
        <label>Mục đích đo:</label>
        <select id="purpose" onchange="updateCompassUI(currentHeading)">
            <option value="house">Nhà / Cửa Chính</option>
            <option value="altar">Bàn Thờ</option>
            <option value="bed">Giường Ngủ</option>
            <option value="kitchen">Bếp Nấu</option>
            <option value="toilet">Nhà Vệ Sinh</option>
            <option value="grave">Mộ Phần (Âm Trạch)</option>
        </select>
    </div>

    <div class="compass-container">
        <div class="compass-dial" id="compass"></div>
        <div class="center-needle" id="needle"></div>
        <div class="center-pin"></div>
    </div>

    <button id="permission-btn" onclick="requestPermission()">KÍCH HOẠT SENSOR LA BÀN</button>

    <div class="panel status-panel">
        <div class="degree-display" id="degree-txt">0° — KHẢM (BẮC)</div>
        <div class="fate-display" id="fate-txt">Mệnh: Khảm Thủy (Đông Tứ Mệnh)</div>
        <div id="judgment-box" class="judgment-badge bg-good">SINH KHÍ — ĐẠI CÁT</div>
        <div id="ngu-hanh" style="margin-top:8px; font-size:0.9rem; color:#bbb"></div>
    </div>

    <div class="panel">
        <p style="color:var(--gold); text-align:center; font-weight:bold">LUẬN GIẢI</p>
        <div id="detail-box" style="background:#111; padding:14px; border-left:4px solid var(--gold); line-height:1.55; font-size:0.9rem; min-height:110px">
        </div>
    </div>

    <div class="panel">
        <button onclick="saveCurrentMeasurement()" style="width:100%">💾 Lưu đo hướng hiện tại</button>
    </div>

    <div class="panel">
        <p style="color:var(--gold); margin-bottom:8px">Lịch sử đo:</p>
        <div id="history-list"></div>
    </div>

    <script>
        // ================== DỮ LIỆU 24 SƠN ==================
        const son24 = [
            {deg: 0,   name: "Tý",   trigram: "Khảm",   nguHanh: "Thủy"},
            {deg: 15,  name: "Quý",  trigram: "Khảm",   nguHanh: "Thủy"},
            {deg: 30,  name: "Sửu",  trigram: "Cấn",   nguHanh: "Thổ"},
            {deg: 45,  name: "Cấn",  trigram: "Cấn",   nguHanh: "Thổ"},
            {deg: 60,  name: "Dần",  trigram: "Cấn",   nguHanh: "Mộc"},
            {deg: 75,  name: "Giáp", trigram: "Chấn",   nguHanh: "Mộc"},
            {deg: 90,  name: "Mão",  trigram: "Chấn",   nguHanh: "Mộc"},
            {deg: 105, name: "Ất",   trigram: "Chấn",   nguHanh: "Mộc"},
            {deg: 120, name: "Thìn", trigram: "Tốn",    nguHanh: "Thổ"},
            {deg: 135, name: "Tốn",  trigram: "Tốn",    nguHanh: "Mộc"},
            {deg: 150, name: "Tỵ",   trigram: "Tốn",    nguHanh: "Hỏa"},
            {deg: 165, name: "Bính", trigram: "Ly",     nguHanh: "Hỏa"},
            {deg: 180, name: "Ngọ",  trigram: "Ly",     nguHanh: "Hỏa"},
            {deg: 195, name: "Đinh", trigram: "Ly",     nguHanh: "Hỏa"},
            {deg: 210, name: "Mùi",  trigram: "Khôn",   nguHanh: "Thổ"},
            {deg: 225, name: "Khôn", trigram: "Khôn",   nguHanh: "Thổ"},
            {deg: 240, name: "Thân", trigram: "Khôn",   nguHanh: "Kim"},
            {deg: 255, name: "Canh", trigram: "Đoài",   nguHanh: "Kim"},
            {deg: 270, name: "Dậu",  trigram: "Đoài",   nguHanh: "Kim"},
            {deg: 285, name: "Tân",  trigram: "Đoài",   nguHanh: "Kim"},
            {deg: 300, name: "Tuất", trigram: "Càn",    nguHanh: "Thổ"},
            {deg: 315, name: "Càn",  trigram: "Càn",    nguHanh: "Kim"},
            {deg: 330, name: "Hợi",  trigram: "Càn",    nguHanh: "Thủy"},
            {deg: 345, name: "Nhâm", trigram: "Khảm",   nguHanh: "Thủy"}
        ];

        const bátTrạchMap = { /* giữ nguyên từ bản gốc */ 
            'Khảm': { 'N': 'Phục Vị', 'NE': 'Ngũ Quỷ', 'E': 'Thiên Y', 'SE': 'Sinh Khí', 'S': 'Diên Niên', 'SW': 'Tuyệt Mệnh', 'W': 'Họa Hại', 'NW': 'Lục Sát', 'group': 'Đông Tứ Mệnh' },
            'Ly':   { 'N': 'Diên Niên', 'NE': 'Họa Hại', 'E': 'Sinh Khí', 'SE': 'Thiên Y', 'S': 'Phục Vị', 'SW': 'Lục Sát', 'W': 'Ngũ Quỷ', 'NW': 'Tuyệt Mệnh', 'group': 'Đông Tứ Mệnh' },
            'Chấn': { 'N': 'Thiên Y', 'NE': 'Lục Sát', 'E': 'Phục Vị', 'SE': 'Diên Niên', 'S': 'Sinh Khí', 'SW': 'Họa Hại', 'W': 'Tuyệt Mệnh', 'NW': 'Ngũ Quỷ', 'group': 'Đông Tứ Mệnh' },
            'Tốn':  { 'N': 'Sinh Khí', 'NE': 'Tuyệt Mệnh', 'E': 'Diên Niên', 'SE': 'Phục Vị', 'S': 'Thiên Y', 'SW': 'Ngũ Quỷ', 'W': 'Lục Sát', 'NW': 'Họa Hại', 'group': 'Đông Tứ Mệnh' },
            'Càn':  { 'N': 'Lục Sát', 'NE': 'Thiên Y', 'E': 'Ngũ Quỷ', 'SE': 'Họa Hại', 'S': 'Tuyệt Mệnh', 'SW': 'Diên Niên', 'W': 'Sinh Khí', 'NW': 'Phục Vị', 'group': 'Tây Tứ Mệnh' },
            'Khôn': { 'N': 'Tuyệt Mệnh', 'NE': 'Sinh Khí', 'E': 'Họa Hại', 'SE': 'Ngũ Quỷ', 'S': 'Lục Sát', 'SW': 'Phục Vị', 'W': 'Thiên Y', 'NW': 'Diên Niên', 'group': 'Tây Tứ Mệnh' },
            'Đoài': { 'N': 'Họa Hại', 'NE': 'Diên Niên', 'E': 'Tuyệt Mệnh', 'SE': 'Lục Sát', 'S': 'Ngũ Quỷ', 'SW': 'Thiên Y', 'W': 'Phục Vị', 'NW': 'Sinh Khí', 'group': 'Tây Tứ Mệnh' },
            'Cấn':  { 'N': 'Ngũ Quỷ', 'NE': 'Phục Vị', 'E': 'Lục Sát', 'SE': 'Họa Hại', 'S': 'Họa Hại', 'SW': 'Sinh Khí', 'W': 'Diên Niên', 'NW': 'Thiên Y', 'group': 'Tây Tứ Mệnh' }
        };

        const cungPhầnTrăm = { /* giữ nguyên */ 
            'Sinh Khí': { cát: true, ý_nghĩa: 'Đại Cát - Tài lộc dồi dào, thăng tiến.' },
            'Thiên Y': { cát: true, ý_nghĩa: 'Trung Cát - Sức khỏe, quý nhân.' },
            'Diên Niên': { cát: true, ý_nghĩa: 'Cát - Quan hệ tốt.' },
            'Phục Vị': { cát: true, ý_nghĩa: 'Tiểu Cát - Bình an.' },
            'Tuyệt Mệnh': { cát: false, ý_nghĩa: 'Đại Hung - Nguy hiểm.' },
            'Ngũ Quỷ': { cát: false, ý_nghĩa: 'Hung - Tai họa.' },
            'Lục Sát': { cát: false, ý_nghĩa: 'Hung - Tranh chấp.' },
            'Họa Hại': { cát: false, ý_nghĩa: 'Tiểu Hung - Xui vặt.' }
        };

        let profiles = [];
        let currentProfile = null;
        let currentHeading = 0;
        let currentSon = null;

        function tinhCungPhi(năm, gioiTinh) {
            let sốDư = năm % 9 || 9;
            if (gioiTinh === 'male') {
                let kq = (11 - sốDư) % 9 || 9;
                const map = {1:'Khảm',2:'Khôn',3:'Chấn',4:'Tốn',5:'Khôn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'};
                return map[kq];
            } else {
                let kq = (sốDư + 4) % 9 || 9;
                const map = {1:'Tốn',2:'Khôn',3:'Chấn',4:'Khôn',5:'Cấn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'};
                return map[kq];
            }
        }

        function loadProfiles() {
            const saved = localStorage.getItem('phongthuy_profiles');
            if (saved) profiles = JSON.parse(saved);
            else {
                profiles = [{id:1, name:"Mẫu", year:1990, gender:"male"}];
                saveProfiles();
            }
            renderProfileSelect();
        }

        function saveProfiles() {
            localStorage.setItem('phongthuy_profiles', JSON.stringify(profiles));
        }

        function renderProfileSelect() {
            const select = document.getElementById('profile-select');
            select.innerHTML = '';
            profiles.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.name} (${p.year} - ${p.gender==='male'?'Nam':'Nữ'})`;
                select.appendChild(opt);
            });
            if (profiles.length > 0) {
                select.value = profiles[0].id;
                loadProfile();
            }
        }

        function addProfile() {
            const name = document.getElementById('new-name').value.trim() || "Người dùng " + (profiles.length+1);
            const year = parseInt(document.getElementById('new-year').value) || 1990;
            const gender = document.getElementById('new-gender').value;
            const newId = Math.max(0, ...profiles.map(p=>p.id)) + 1;
            profiles.push({id: newId, name, year, gender});
            saveProfiles();
            renderProfileSelect();
        }

        function loadProfile() {
            const id = parseInt(document.getElementById('profile-select').value);
            currentProfile = profiles.find(p => p.id === id);
            if (currentProfile) {
                document.getElementById('fate-txt').innerText = 
                    `Mệnh: ${tinhCungPhi(currentProfile.year, currentProfile.gender)} (${currentProfile.name})`;
                updateCompassUI(currentHeading);
            }
        }

        function getSon24(heading) {
            let minDiff = 360;
            let best = son24[0];
            for (let s of son24) {
                let diff = Math.abs(heading - s.deg);
                if (diff > 180) diff = 360 - diff;
                if (diff < minDiff) {
                    minDiff = diff;
                    best = s;
                }
            }
            return best;
        }

        function updateCompassUI(heading) {
            currentHeading = Math.round(heading % 360);
            document.getElementById('compass').style.transform = `rotate(${-currentHeading}deg)`;

            currentSon = getSon24(currentHeading);
            const cung8 = currentSon.trigram;

            let currentCungText = `${currentSon.name} (${currentSon.trigram}) ${currentSon.nguHanh}`;
            document.getElementById('degree-txt').innerText = `${currentHeading}° — ${currentCungText}`;

            document.getElementById('ngu-hanh').innerHTML = `Ngũ Hành: <b>${currentSon.nguHanh}</b>`;

            const chuMenh = tinhCungPhi(currentProfile ? currentProfile.year : 1990, currentProfile ? currentProfile.gender : 'male');
            const cungTrach = bátTrạchMap[chuMenh] ? bátTrạchMap[chuMenh][currentSon.trigram[0] === 'K' || currentSon.trigram === 'Khảm' ? 'N' : 
                currentSon.deg >=23 && currentSon.deg <68 ? 'NE' : /* ... rút gọn */ 'N'] : 'Phục Vị';

            const info = cungPhầnTrăm[cungTrach] || {cát:true, ý_nghĩa:'...'};
            const purpose = document.getElementById('purpose').value;

            const judgmentBox = document.getElementById('judgment-box');
            const detailBox = document.getElementById('detail-box');

            if (info.cát) {
                judgmentBox.className = "judgment-badge bg-good";
                judgmentBox.innerText = cungTrach;
            } else {
                judgmentBox.className = "judgment-badge bg-bad";
                judgmentBox.innerText = cungTrach;
            }

            let text = `24 Sơn: ${currentSon.name} - ${currentSon.nguHanh}<br>`;
            text += `Bát Trạch: ${cungTrach}<br><br>`;
            text += info.ý_nghĩa + "<br><br>";

            if (purpose === 'kitchen' && !info.cát) text += "◆ RẤT TỐT để đặt bếp (Tọa Hung).";
            else if (purpose === 'grave') text += "Âm Trạch: Hướng này hợp mộ phần nếu thuộc cung cát.";

            detailBox.innerHTML = text;
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || (event.alpha ? (360 - event.alpha) : null);
            if (heading !== null) updateCompassUI(heading);
        }

        function requestPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(r => {
                    if (r === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        document.getElementById('permission-btn').style.display = 'none';
                    }
                });
            }
        }

        function saveCurrentMeasurement() {
            if (!currentSon) return alert("Chưa có dữ liệu đo!");
            const history = JSON.parse(localStorage.getItem('phongthuy_history') || '[]');
            history.unshift({
                time: new Date().toLocaleString('vi-VN'),
                degree: currentHeading,
                son: currentSon.name,
                nguHanh: currentSon.nguHanh,
                batTrach: document.getElementById('judgment-box').innerText
            });
            if (history.length > 20) history.pop();
            localStorage.setItem('phongthuy_history', JSON.stringify(history));
            renderHistory();
            alert("Đã lưu đo hướng!");
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('phongthuy_history') || '[]');
            list.innerHTML = history.map(h => `
                <div class="history-item">
                    <b>${h.time}</b><br>
                    ${h.degree}° — ${h.son} (${h.nguHanh}) → ${h.batTrach}
                </div>
            `).join('');
        }

        function manualRotate(v) { updateCompassUI(v); }

        // Khởi tạo
        window.addEventListener('DOMContentLoaded', () => {
            loadProfiles();
            renderHistory();
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('permission-btn').style.display = 'block';
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
            updateCompassUI(0);
        });
    </script>
</body>
</html>
